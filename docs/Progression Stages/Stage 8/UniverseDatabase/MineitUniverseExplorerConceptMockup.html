<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>MineIT Universe Explorer — Concept Mock</title>
<style>
:root{
  --bg:#05090c;--panel:#091117;--panel2:#101a21;--panel3:#15232c;
  --line:#273a45;--text:#edf4f7;--muted:#8ea1ac;--accent:#67c8ff;
  --accent2:#8ce2bd;--warn:#f4c56d;--selected:#153247;--link:#dff4ff
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
.app{height:100vh;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr);background:linear-gradient(180deg,#071018,#05090c 42%)}
.topbar{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--line);background:#081015}
.title{min-width:0;flex:1}.title small{display:block;color:var(--accent);font-size:8px;letter-spacing:.14em;font-weight:900}.title strong{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mockTag{font-size:9px;color:var(--warn);border:1px solid #6d5529;background:#21190b;padding:5px 7px;border-radius:6px;font-weight:900}
.workspace{min-height:0;display:flex;flex-direction:column;overflow:hidden}
.detailPane{flex:0 0 60%;min-height:0;overflow:auto;padding:12px 12px 18px;background:radial-gradient(circle at 92% 0,#0c1c25 0,transparent 32%)}
.divider{flex:0 0 15px;position:relative;background:#081015;border-top:1px solid var(--line);border-bottom:1px solid var(--line);cursor:row-resize;touch-action:none;display:grid;place-items:center;user-select:none}
.divider::after{content:"";width:56px;height:4px;border-radius:999px;background:#47606e}.divider.dragging::after{background:var(--accent)}
.explorerPane{min-height:0;flex:1 1 auto;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:6px;padding:7px 8px 10px;background:#081015}
.explorerToolbar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}.perspective{border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:7px 3px;font-size:10px;font-weight:900;min-width:0}.perspective.active{background:#163044;border-color:#3e87ad;color:#dff4ff}
.searchRow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px}.search{width:100%;border:1px solid var(--line);background:#071015;border-radius:6px;padding:7px 9px;outline:0;font-size:11px}.treeAction{border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:0 9px;font-size:10px;font-weight:800}.search:focus{border-color:#477a96}
.tree{min-height:0;overflow:auto;padding:1px 0 20px;scroll-behavior:smooth}.tree ul{list-style:none;margin:0;padding-left:15px}.tree>.treeRoot{padding-left:0}.tree li{margin:1px 0}.treeRow{display:grid;grid-template-columns:20px minmax(0,1fr);align-items:center;min-height:29px;border-radius:5px}.treeRow.selected{background:var(--selected);outline:1px solid #35637d}.twisty{width:20px;height:27px;border:0;background:transparent;padding:0;color:#819da9;font-size:12px}.twisty.empty{visibility:hidden}.node{min-width:0;border:0;background:transparent;text-align:left;padding:5px 4px;color:#dce7eb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px}.node .kind{margin-left:5px;color:var(--muted);font-size:8px;text-transform:uppercase}.categoryNode{color:#a9bac3;font-weight:800}.searchEmpty{padding:12px 4px;color:var(--muted);font-size:11px}
.breadcrumbs{display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin-bottom:10px;color:var(--muted);font-size:9px}.crumb{border:0;background:transparent;color:#adc1cb;padding:0}.crumb.linked{color:#bfe8ff}.hero{display:grid;grid-template-columns:74px minmax(0,1fr);gap:11px;align-items:center}.placeholder{width:74px;height:74px;border-radius:9px;border:1px solid #36515f;background:linear-gradient(135deg,#12242d,#0b1217);display:grid;place-items:center;color:#74c9f3;font-weight:900;font-size:22px}.eyebrow{font-size:9px;color:var(--accent2);letter-spacing:.12em;text-transform:uppercase;font-weight:900}.hero h1{margin:3px 0 3px;font-size:21px;line-height:1.05}.subtitle{font-size:11px;color:#aabac2;line-height:1.3}.description{margin-top:11px;color:#d7e2e7;font-size:12px;line-height:1.55}
.section{margin-top:12px;border:1px solid var(--line);background:rgba(12,20,26,.92);border-radius:8px;overflow:hidden}.section h2{margin:0;padding:7px 9px;border-bottom:1px solid var(--line);background:#0e171d;color:#9fb4bf;font-size:9px;letter-spacing:.12em;text-transform:uppercase}.fieldRows{display:grid}.field{display:grid;grid-template-columns:minmax(92px,36%) minmax(0,1fr);gap:8px;padding:7px 9px;border-top:1px solid #17252d;font-size:11px;align-items:start}.field:first-child{border-top:0}.fieldLabel{color:var(--muted);font-size:10px}.fieldValue{min-width:0;color:#e0e9ed;line-height:1.35}.entityLink{border:0;background:transparent;padding:0;color:var(--link);text-align:left;text-decoration:underline;text-decoration-color:#426f87;text-underline-offset:2px;font-weight:700}.entityLink::after{content:"  →";color:var(--accent)}.multiLinks{display:flex;flex-wrap:wrap;gap:5px}.multiLinks .entityLink{border:1px solid #35576a;background:#102633;border-radius:999px;padding:4px 7px;text-decoration:none;font-size:10px}.multiLinks .entityLink::after{content:""}.tagList{display:flex;flex-wrap:wrap;gap:5px}.tag{border:1px solid #384a53;background:#10191e;color:#ced9de;border-radius:999px;padding:3px 7px;font-size:9px}.resource{padding:8px 9px;border-top:1px solid #17252d}.resource:first-child{border-top:0}.resourceTop{display:flex;justify-content:space-between;gap:8px;align-items:start}.resource strong{font-size:11px}.resourceMeta{color:#a7bac4;font-size:9px;text-align:right}.resource p{margin:4px 0 0;color:#cbd7dc;font-size:10px;line-height:1.4}.longText{padding:9px;color:#d3dfe4;font-size:11px;line-height:1.55}.dev{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 10px;font-size:9px}.dev span:nth-child(odd){color:var(--muted)}.dev code{overflow-wrap:anywhere;color:#dbe8ed}.mockNote{margin-top:10px;padding:7px 9px;border:1px solid #594824;background:#1b160b;color:#e9cb8f;border-radius:7px;font-size:9px;line-height:1.4}
@media(min-width:800px){.topbar{padding:10px 14px}.title small{font-size:9px}.title strong{font-size:16px}.detailPane{padding:16px 22px 22px}.hero{grid-template-columns:92px minmax(0,1fr)}.placeholder{width:92px;height:92px;font-size:28px}.hero h1{font-size:25px}.description{font-size:13px}.field{grid-template-columns:190px minmax(0,1fr);font-size:12px}.explorerPane{padding-left:14px;padding-right:14px}.node{font-size:12px}}
@media(max-height:650px){.detailPane{flex-basis:55%}.field{padding-top:5px;padding-bottom:5px}.section{margin-top:8px}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="title"><small>MINEIT UNIVERSE DATABASE</small><strong>Universe Explorer</strong></div>
    <div class="mockTag">CONCEPT MOCK • EMBEDDED DATA</div>
  </header>

  <main class="workspace" id="workspace">
    <section class="detailPane" id="detail"></section>
    <div class="divider" id="divider" aria-label="Resize detail and explorer panels"></div>
    <section class="explorerPane">
      <div class="explorerToolbar">
        <button class="perspective active" data-view="geography">Geography</button>
        <button class="perspective" data-view="organisation">Organisation</button>
        <button class="perspective" data-view="directory">Directory</button>
      </div>
      <div class="searchRow">
        <input class="search" id="search" placeholder="Search universe..." autocomplete="off">
        <button class="treeAction" id="collapseAll">Collapse</button>
      </div>
      <div class="tree" id="tree"></div>
    </section>
  </main>
</div>

const trees={geography,organisation,directory};
let activeView="geography";
let selectedId="company-helix-industrial-group";
const openNodes=new Set();

const treeEl=document.getElementById("tree");
const detailEl=document.getElementById("detail");
const searchEl=document.getElementById("search");
const detailPane=document.getElementById("detail");
const workspace=document.getElementById("workspace");
const divider=document.getElementById("divider");

function nodeKey(node){return node.id||`label:${node.label}`}
function nodeLabel(node){return node.id?(entities[node.id]?.name||node.id):node.label}

function findPath(node,target,path=[]){
  const next=[...path,nodeKey(node)];
  if(node.id===target)return next;
  for(const child of node.children||[]){const found=findPath(child,target,next);if(found)return found}
  return null;
}

function revealSelected(){
  const path=findPath(trees[activeView],selectedId);
  if(path) path.slice(0,-1).forEach(key=>openNodes.add(key));
}

function collapseAll(){openNodes.clear();revealSelected();renderTree()}

function renderNode(node){
  const key=nodeKey(node),children=node.children||[],hasChildren=children.length>0,isOpen=openNodes.has(key),entity=node.id?entities[node.id]:null;
  const li=document.createElement("li");
  const row=document.createElement("div");row.className=`treeRow${node.id===selectedId?" selected":""}`;if(node.id===selectedId)row.dataset.selected="true";
  const twist=document.createElement("button");twist.className=`twisty${hasChildren?"":" empty"}`;twist.textContent=hasChildren?(isOpen?"▾":"▸"):"";
  twist.onclick=e=>{e.stopPropagation();if(!hasChildren)return;isOpen?openNodes.delete(key):openNodes.add(key);renderTree()};
  const button=document.createElement("button");button.className=`node${node.id?"":" categoryNode"}`;
  button.innerHTML=`${nodeLabel(node)}${entity?` <span class="kind">${entity.type}</span>`:""}`;
  button.onclick=()=>{if(node.id){selectEntity(node.id)}else if(hasChildren){isOpen?openNodes.delete(key):openNodes.add(key);renderTree()}};
  row.append(twist,button);li.append(row);
  if(hasChildren&&isOpen){const ul=document.createElement("ul");children.forEach(child=>ul.append(renderNode(child)));li.append(ul)}
  return li;
}

function renderTree(){
  treeEl.innerHTML="";
  const query=searchEl.value.trim().toLowerCase();
  if(query){
    const matches=Object.entries(entities).filter(([id,e])=>`${e.name} ${e.type} ${e.subtitle} ${e.description}`.toLowerCase().includes(query));
    if(!matches.length){treeEl.innerHTML='<div class="searchEmpty">No matching universe entities.</div>';return}
    const ul=document.createElement("ul");ul.className="treeRoot";matches.forEach(([id])=>ul.append(renderNode({id})));treeEl.append(ul);return;
  }
  const ul=document.createElement("ul");ul.className="treeRoot";ul.append(renderNode(trees[activeView]));treeEl.append(ul);
}

function linkButton(id,label){const e=entities[id];if(!e)return `<span>${label||id}</span>`;return `<button class="entityLink" data-ref="${id}">${label||e.name}</button>`}
function fieldValue(field){
  if(field.ref)return linkButton(field.ref);
  if(field.refs)return `<div class="multiLinks">${field.refs.map(id=>linkButton(id)).join("")}</div>`;
  if(field.tags)return `<div class="tagList">${field.tags.map(t=>`<span class="tag">${t}</span>`).join("")}</div>`;
  return field.text||"—";
}

function contextFor(entity){return (entity.context||[]).map(id=>entities[id]?linkButton(id,entities[id].name):`<span>${id}</span>`).join('<span>›</span>')}

function renderDetail(){
  const e=entities[selectedId];if(!e)return;
  const fields=(e.fields||[]).map(field=>`<div class="field"><div class="fieldLabel">${field.label}</div><div class="fieldValue">${fieldValue(field)}</div></div>`).join("");
  const resources=e.resources?`<section class="section"><h2>Resource requirements</h2>${e.resources.map(r=>`<div class="resource"><div class="resourceTop"><strong>${r.name}</strong><div class="resourceMeta">${r.meta}</div></div><p>${r.reason}</p></div>`).join("")}</section>`:"";
  const biography=e.biography?`<section class="section"><h2>Biography</h2><div class="longText">${e.biography}</div></section>`:"";
  const history=e.history?`<section class="section"><h2>History</h2><div class="longText">${e.history}</div></section>`:"";
  const visual=e.visual?`<section class="section"><h2>Visual description</h2><div class="longText">${e.visual}</div></section>`:"";
  detailEl.innerHTML=`
    <div class="breadcrumbs">${contextFor(e)}</div>
    <div class="hero"><div class="placeholder">${e.icon||"?"}</div><div><div class="eyebrow">${e.type}</div><h1>${e.name}</h1><div class="subtitle">${e.subtitle||""}</div></div></div>
    <div class="description">${e.description||""}</div>
    <section class="section"><h2>Details</h2><div class="fieldRows">${fields}</div></section>
    ${resources}${biography}${history}${visual}
    <section class="section"><h2>Development details</h2><div class="longText"><div class="dev"><span>ID</span><code>${selectedId}</code><span>Perspective</span><code>${activeView}</code><span>Source</span><code>Embedded Concept Mock 0 data</code></div></div></section>
    <div class="mockNote">Concept Mock 0: embedded data exists only to prove the navigation model. The real Universe Directory will load canonical JSON collections.</div>`;
  detailEl.querySelectorAll("[data-ref]").forEach(btn=>btn.onclick=()=>selectEntity(btn.dataset.ref));
}

function selectEntity(id){
  if(!entities[id])return;
  selectedId=id;
  revealSelected();
  renderDetail();renderTree();
  requestAnimationFrame(()=>{const row=treeEl.querySelector('[data-selected="true"]');if(row)row.scrollIntoView({block:"nearest"})});
}

function switchView(view){
  activeView=view;document.querySelectorAll(".perspective").forEach(btn=>btn.classList.toggle("active",btn.dataset.view===view));
  revealSelected();renderTree();renderDetail();
  requestAnimationFrame(()=>{const row=treeEl.querySelector('[data-selected="true"]');if(row)row.scrollIntoView({block:"nearest"})});
}

document.querySelectorAll(".perspective").forEach(btn=>btn.onclick=()=>switchView(btn.dataset.view));
searchEl.addEventListener("input",renderTree);
document.getElementById("collapseAll").onclick=collapseAll;

let dragging=false;
function applySplit(percent){
  const pct=Math.max(25,Math.min(75,percent));detailPane.style.flexBasis=`${pct}%`;sessionStorage.setItem("mineitUniverseMockSplit",String(pct));
}
divider.addEventListener("pointerdown",e=>{dragging=true;divider.classList.add("dragging");divider.setPointerCapture(e.pointerId)});
divider.addEventListener("pointermove",e=>{if(!dragging)return;const rect=workspace.getBoundingClientRect();applySplit(((e.clientY-rect.top)/rect.height)*100)});
divider.addEventListener("pointerup",e=>{dragging=false;divider.classList.remove("dragging");try{divider.releasePointerCapture(e.pointerId)}catch{}});
divider.addEventListener("pointercancel",()=>{dragging=false;divider.classList.remove("dragging")});

const savedSplit=Number(sessionStorage.getItem("mineitUniverseMockSplit"));if(Number.isFinite(savedSplit)&&savedSplit>=25&&savedSplit<=75)applySplit(savedSplit);
revealSelected();renderTree();renderDetail();
</script>
