name: Compact Resource Filters PR Trigger

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/compact-resource-filters' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/compact-resource-filters
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch from builder recipe
        run: |
          awk '/^          python3 - <<'"'"'PY'"'"'$/{flag=1;next}/^          PY$/{flag=0}flag{sub(/^          /,"");print}' .github/workflows/compact-resource-filters-builder.yml > /tmp/compact-filter-patch.py
          python3 /tmp/compact-filter-patch.py
          npm test
      - name: Commit compact filter redesign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mapfile -t files < <(git status --short | awk '{print $2}' | grep -v '^\.github/workflows/' || true)
          if [ ${#files[@]} -eq 0 ]; then exit 0; fi
          git add -- "${files[@]}"
          git commit -m "Redesign resource filters to preserve map viewport"
          git push origin HEAD:fix/compact-resource-filters
