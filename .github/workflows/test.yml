name: Test

on:
  push:
    branches:
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - develop
      - main
      - 'feature/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run unit and regression tests
        run: npm test
      - name: Browser startup smoke test
        run: |
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/mineit-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$chrome" ]; then
            echo "No Chrome/Chromium executable available on runner"
            exit 1
          fi
          "$chrome" --headless --no-sandbox --disable-gpu --window-size=412,915 --virtual-time-budget=5000 --dump-dom http://127.0.0.1:8123/ >/tmp/mineit-dom.html 2>/tmp/mineit-chrome.log
          grep -q 'id="mapViewToggle"' /tmp/mineit-dom.html
          grep -q 'landing-choice-grid' /tmp/mineit-dom.html
          if grep -Eq 'id="world"[^>]*(height="0"|height: 0px)' /tmp/mineit-dom.html; then
            echo "Map canvas collapsed to zero height"
            cat /tmp/mineit-dom.html
            exit 1
          fi
          if ! grep -Eq 'id="world"[^>]*height="[1-9][0-9]*"' /tmp/mineit-dom.html; then
            echo "Map canvas has no positive drawing height"
            cat /tmp/mineit-dom.html
            exit 1
          fi
          if grep -q 'STARTUP ERROR' /tmp/mineit-dom.html; then
            cat /tmp/mineit-dom.html
            cat /tmp/mineit-chrome.log
            exit 1
          fi
