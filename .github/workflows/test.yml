name: Test

on:
  workflow_dispatch:

  push:
    branches:
      - develop
      - CleanUp
      - 'feature/**'
      - 'refactor/**'
      - 'hotfix/**'
      - 'fix/**'
  pull_request:
    branches:
      - develop
      - main
      - CleanUp
      - 'feature/**'
      - 'fix/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run unit, regression and domain coverage tests
        run: |
          rm -rf .coverage
          NODE_V8_COVERAGE=.coverage/raw npm test
          node tests/coverage-report.js
      - name: Browser startup and presentation interaction tests
        run: |
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/mineit-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$chrome" ]; then
            echo "No Chrome/Chromium executable available on runner"
            exit 1
          fi

          "$chrome" --headless --no-sandbox --disable-gpu --enable-logging=stderr --window-size=412,915 --virtual-time-budget=5000 --dump-dom http://127.0.0.1:8123/ >/tmp/mineit-dom.html 2>/tmp/mineit-chrome.log
          for pattern in 'id="mapViewToggle"' 'id="mapFilterToggle"' 'map-filter-tabs' 'id="overlayRoot"' 'id="attentionStrip"' 'id="contextBar"' 'landing-choice-grid'; do
            if ! grep -q "$pattern" /tmp/mineit-dom.html; then
              echo "Startup DOM is missing: $pattern"
              cat /tmp/mineit-dom.html
              cat /tmp/mineit-chrome.log
              cat /tmp/mineit-http.log
              exit 1
            fi
          done
          if grep -Eq 'id="world"[^>]*(height="0"|height: 0px)' /tmp/mineit-dom.html; then
            echo "Map canvas collapsed to zero height"
            cat /tmp/mineit-dom.html
            exit 1
          fi
          if ! grep -Eq 'id="world"[^>]*height="[1-9][0-9]*"' /tmp/mineit-dom.html; then
            echo "Map canvas has no positive drawing height"
            cat /tmp/mineit-dom.html
            exit 1
          fi
          if grep -q 'STARTUP ERROR' /tmp/mineit-dom.html; then
            cat /tmp/mineit-dom.html
            cat /tmp/mineit-chrome.log
            cat /tmp/mineit-http.log
            exit 1
          fi

          for size in 360,640 375,667 390,844 412,915 915,412; do
            echo "Testing viewport $size"
            "$chrome" --headless --no-sandbox --disable-gpu --window-size="$size" --virtual-time-budget=9000 --dump-dom http://127.0.0.1:8123/tests/mobile-layout-probe.html >"/tmp/layout-$size.html" 2>"/tmp/layout-$size.log"
            if ! grep -q 'PASS presentation layout, unified map, contextual actions and footer controls' "/tmp/layout-$size.html"; then
              echo "Presentation interaction probe failed at $size"
              cat "/tmp/layout-$size.html"
              cat "/tmp/layout-$size.log"
              cat /tmp/mineit-http.log
              exit 1
            fi
          done

          echo "Testing landed player ship opening gesture click-through"
          "$chrome" --headless --no-sandbox --disable-gpu --window-size=390,844 --virtual-time-budget=8000 --dump-dom http://127.0.0.1:8123/tests/player-ship-clickthrough-probe.html >/tmp/player-ship-clickthrough.html 2>/tmp/player-ship-clickthrough.log
          if ! grep -q 'PASS player ship opening gesture cannot click through to Star Map' /tmp/player-ship-clickthrough.html; then
            echo "Player ship click-through probe failed"
            cat /tmp/player-ship-clickthrough.html
            cat /tmp/player-ship-clickthrough.log
            cat /tmp/mineit-http.log
            exit 1
          fi

          echo "Testing first-contract renewal and multi-colony event lifecycle"
          "$chrome" --headless --no-sandbox --disable-gpu --window-size=390,844 --virtual-time-budget=12000 --dump-dom http://127.0.0.1:8123/tests/multi-colony-lifecycle-probe.html >/tmp/lifecycle.html 2>/tmp/lifecycle.log
          if ! grep -q 'PASS first contract renewal, second colony, recovered ship queue and colony switching' /tmp/lifecycle.html; then
            echo "Multi-colony lifecycle probe failed"
            cat /tmp/lifecycle.html
            cat /tmp/lifecycle.log
            cat /tmp/mineit-http.log
            exit 1
          fi

          echo "Testing repeated UI open/close lifecycle stability"
          "$chrome" --headless --no-sandbox --disable-gpu --window-size=420,920 --virtual-time-budget=20000 --dump-dom http://127.0.0.1:8123/tests/ui-lifecycle-soak.html >/tmp/ui-soak.html 2>/tmp/ui-soak.log
          if ! grep -q 'PASS UI lifecycle soak' /tmp/ui-soak.html; then
            echo "UI lifecycle soak failed"
            cat /tmp/ui-soak.html
            cat /tmp/ui-soak.log
            cat /tmp/mineit-http.log
            exit 1
          fi

          echo "Testing mobile development-task JSON and clipboard workflow"
          "$chrome" --headless --no-sandbox --disable-gpu --window-size=390,844 --virtual-time-budget=15000 --dump-dom http://127.0.0.1:8123/tests/development-tasks-probe.html >/tmp/development-tasks.html 2>/tmp/development-tasks.log
          if ! grep -q 'PASS development task file, type/status filters, import, status icons, editor, numbered multi-copy, autosave and simulation pause' /tmp/development-tasks.html; then
            echo "Development Tasks interaction probe failed"
            cat /tmp/development-tasks.html
            cat /tmp/development-tasks.log
            cat /tmp/mineit-http.log
            exit 1
          fi

          for size in 360,640 375,667 390,844 412,915 915,412; do
            echo "Testing Conglomerate Buyers Service viewport $size"
            "$chrome" --headless --no-sandbox --disable-gpu --window-size="$size" --virtual-time-budget=12000 --dump-dom http://127.0.0.1:8123/tests/buyer-mobile-layout-probe.html >"/tmp/buyers-$size.html" 2>"/tmp/buyers-$size.log"
            if ! grep -Fq '<div id="result">PASS buyer catalogue, profile and collection mobile viewport coverage</div>' "/tmp/buyers-$size.html"; then
              echo "Conglomerate Buyers Service presentation probe failed at $size"
              echo "Rendered buyer probe result:"
              {
                echo "viewport=$size"
                grep -o '<div id="result">[^<]*</div>' "/tmp/buyers-$size.html" || echo '<div id="result">RESULT NOT FOUND</div>'
                echo "--- chrome log ---"
                cat "/tmp/buyers-$size.log"
              } > /tmp/buyer-probe-result.txt
              cat /tmp/buyer-probe-result.txt
              cat /tmp/mineit-http.log
              exit 1
            fi
          done
      - name: Upload buyer probe failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buyer-probe-failure
          path: /tmp/buyer-probe-result.txt
          if-no-files-found: ignore
