name: Mobile Map Hotfix Builder

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'hotfix/mobile-map-layout'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/mobile-map-layout
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply map sizing repair and bump 5.5.2
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('css/app.css')
          text = app.read_text()
          old = '#app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}'
          new = '#app{height:100vh;height:100dvh;display:grid;grid-template-rows:auto minmax(160px,1fr) auto;overflow:hidden}'
          if old not in text:
              raise SystemExit('Expected #app layout rule not found')
          app.write_text(text.replace(old, new))

          world_css = Path('css/world.css')
          text = world_css.read_text()
          old = '#worldShell{display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden;min-height:0;background:#000}'
          new = '#worldShell{display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden;min-height:160px;background:#000}'
          if old not in text:
              raise SystemExit('Expected #worldShell layout rule not found')
          world_css.write_text(text.replace(old, new))

          view = Path('js/ui/world-view.js')
          text = view.read_text()
          old = 'resize(){const r=this.shell.getBoundingClientRect(),dpr=Math.max(1,devicePixelRatio||1);this.canvas.width=r.width*dpr;this.canvas.height=r.height*dpr;this.canvas.style.width=`${r.width}px`;this.canvas.style.height=`${r.height}px`;this.ctx.setTransform(dpr,0,0,dpr,0,0);this.width=r.width;this.height=r.height;this.cell=Math.min(this.width,this.height)/CONFIG.GRID_SIZE;this.safeDraw();}'
          new = 'resize(){const r=this.shell.getBoundingClientRect(),header=document.querySelector(".app-header")?.getBoundingClientRect().height||0,footer=document.querySelector(".app-footer")?.getBoundingClientRect().height||0,viewport=window.visualViewport?.height||window.innerHeight||0,width=Math.max(1,r.width||window.innerWidth||320),fallbackHeight=Math.max(160,viewport-header-footer),height=Math.max(160,r.height||fallbackHeight),dpr=Math.max(1,devicePixelRatio||1);if(r.height<2)this.shell.style.minHeight=`${height}px`;this.canvas.width=Math.max(1,Math.round(width*dpr));this.canvas.height=Math.max(1,Math.round(height*dpr));this.canvas.style.width=`${width}px`;this.canvas.style.height=`${height}px`;this.ctx.setTransform(dpr,0,0,dpr,0,0);this.width=width;this.height=height;this.cell=Math.max(1,Math.min(this.width,this.height)/CONFIG.GRID_SIZE);this.safeDraw();}'
          if old not in text:
              raise SystemExit('Expected WorldView.resize implementation not found')
          view.write_text(text.replace(old, new))

          allowed = {'.js', '.html', '.json', '.css', '.md'}
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or '.github' in path.parts or path.suffix.lower() not in allowed:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated = text.replace('5.5.1', '5.5.2').replace(r'5\.5\.1', r'5\.5\.2')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
          PY
          npm test
      - name: Commit application hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mapfile -t files < <(git diff --name-only | grep -v '^\.github/workflows/' || true)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No application changes to commit"
            exit 0
          fi
          git add -- "${files[@]}"
          git commit -m "Fix collapsed mobile map viewport"
          git push origin HEAD:hotfix/mobile-map-layout
