name: Presentation Architecture Builder

on:
  push:
    branches:
      - refactor/presentation-architecture

permissions:
  contents: write

jobs:
  refactor-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/presentation-architecture
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Consolidate presentation architecture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re

          # Shared filter definitions are neutral data, not owned by either renderer or controls.
          p=Path('js/ui/map-controls.js')
          s=p.read_text()
          s=re.sub(r'^export const STATE_FILTERS=.*?\nexport const TYPE_FILTERS=.*?\nexport const SIZE_FILTERS=.*?\n\n', 'import { STATE_FILTERS, TYPE_FILTERS, SIZE_FILTERS } from "./map-filter-definitions.js?v=5.6.0";\n\n', s, count=1, flags=re.S)
          p.write_text(s)

          # Turn the old WorldView into the canvas/input/rendering base only.
          p=Path('js/ui/world-view.js')
          s=p.read_text()
          s=s.replace('    this.filterHost=document.querySelector("#mapFilterHost")||this.shell;\n','',1)
          s=s.replace('    this.filtersOpen=false;this.filterCategory="type";\n','',1)
          s=s.replace('    this.bindViewToggle();this.bindFilters();this.bindInput();','    this.bindInput();',1)
          s,n=re.subn(r'  bindViewToggle\(\)\{.*?\n  tileFilterBucket\(', '  tileFilterBucket(', s, count=1, flags=re.S)
          if n!=1: raise SystemExit(f'world controls removal count {n}')
          s,n=re.subn(r'  resize\(\)\{.*?\n  safeDraw\(\)', '''  resize(){const r=this.shell.getBoundingClientRect(),width=Math.max(1,r.width),height=Math.max(1,r.height),dpr=Math.min(2,Math.max(1,devicePixelRatio||1));this.canvas.width=Math.max(1,Math.round(width*dpr));this.canvas.height=Math.max(1,Math.round(height*dpr));this.canvas.style.removeProperty("width");this.canvas.style.removeProperty("height");this.ctx.setTransform(dpr,0,0,dpr,0,0);this.width=width;this.height=height;this.cell=Math.max(1,Math.min(width,height)/CONFIG.GRID_SIZE);this.safeDraw();}\n  safeDraw()''', s, count=1, flags=re.S)
          if n!=1: raise SystemExit(f'world resize replacement count {n}')
          p.write_text(s)

          # The v5.6 composition class explicitly attaches controls after the pure canvas base is ready.
          p=Path('js/ui/world-view-v56.js')
          s=p.read_text()
          s=s.replace('export class WorldView extends CanvasWorldView{\n  bindViewToggle(){','export class WorldView extends CanvasWorldView{\n  constructor(options){super(options);this.bindViewToggle();}\n\n  bindViewToggle(){',1)
          p.write_text(s)

          # Canonical map/layout stylesheet. No runtime-injected CSS and no second filter row.
          Path('css/world.css').write_text(''':root{--map-toolbar-height:30px}\n#worldShell{position:relative;display:grid;grid-template-rows:var(--map-toolbar-height) minmax(0,1fr);overflow:hidden;min-height:0;background:#000}\n#mapViewHost{position:relative;z-index:20;height:var(--map-toolbar-height);min-height:var(--map-toolbar-height);display:flex;align-items:center;padding:2px 3px;background:#05080a;border-bottom:1px solid var(--line);touch-action:manipulation;overflow:hidden}\n#worldViewport{position:relative;overflow:hidden;touch-action:none;min-width:0;min-height:0}\n#world{position:absolute;inset:0;width:100%;height:100%;background:#000}\n#overlayRoot{position:absolute;left:0;right:0;top:var(--map-toolbar-height);bottom:0;z-index:30;overflow:hidden;pointer-events:none}\n#overlayRoot>.panel,#overlayRoot>.error-badge{pointer-events:auto}\n#overlayRoot>.toast{pointer-events:none}\n.map-toolbar-main{display:flex;align-items:center;gap:4px;width:100%;height:100%;min-width:0}\n.map-view-toggle{display:flex;gap:3px;min-width:0;touch-action:manipulation}.map-view-toggle button{min-height:25px;padding:3px 8px;font-size:7px;font-weight:900;letter-spacing:.05em;opacity:.55;background:#0b1116;border-color:#26333d;color:var(--muted)}.map-view-toggle button.active{opacity:1;background:#17313d;border-color:var(--accent);color:#effaff;box-shadow:0 0 0 1px rgba(118,198,255,.18) inset}\n.map-filter-toggle{margin-left:auto;flex:0 0 auto;min-height:25px;padding:3px 8px;font-size:7px;font-weight:900;letter-spacing:.04em;background:#0b1116;border-color:#26333d;color:var(--muted)}.map-filter-toggle.active{background:#17313d;border-color:var(--accent);color:#effaff}\n.map-filters{display:flex;align-items:center;gap:2px;width:100%;height:100%;min-width:0;padding:0;background:#05080a;touch-action:manipulation;overflow:hidden}\n.map-filter-back{flex:0 0 auto;min-height:21px;padding:2px 6px;font-size:6px;font-weight:900;background:#111a20;border-color:#31414c;color:#c9d8df}\n.map-filter-tabs{display:flex;flex:1 1 auto;gap:2px;min-width:0;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none}.map-filter-tabs::-webkit-scrollbar,.map-filter-options::-webkit-scrollbar{display:none}\n.map-filter-category{flex:1 0 auto;min-height:21px;padding:2px 7px;font-size:6.2px;font-weight:900;background:#0b1116;border-color:#26333d;color:var(--muted)}.map-filter-category.active{background:#13222c;border-color:var(--accent);color:#e6f6ff}\n.map-filter-group{display:flex;flex:1 1 auto;min-width:0;overflow:hidden}.map-filter-options{display:flex;flex:1 1 auto;flex-wrap:nowrap;gap:2px;min-width:0;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none}\n.map-filter,.map-filter-bulk{flex:0 0 auto;min-height:21px;padding:2px 5px;font-size:6.1px;font-weight:800;letter-spacing:.01em;background:#0b1116;border-color:#26333d;color:var(--muted)}.map-filter{opacity:.36}.map-filter.active{opacity:1;background:#13222c;border-color:var(--accent);color:#e6f6ff;box-shadow:0 0 0 1px rgba(118,198,255,.18) inset}.map-filter-bulk{opacity:.8;color:#8fa1aa;border-style:dashed}.map-filter-bulk:active{background:#18242c}\n.map-filter[data-map-filter="locked"].active{border-color:var(--warn);color:var(--warn);box-shadow:0 0 0 1px rgba(255,209,102,.16) inset}.map-filter[data-map-quality].active{background:#10171c}.map-filter[data-map-quality].q0.active{color:#d7e0e5}.map-filter[data-map-quality].q1.active{color:#8fdca3}.map-filter[data-map-quality].q2.active{color:#65c8ff}.map-filter[data-map-quality].q3.active{color:#c69cff}.map-filter[data-map-quality].q4.active{color:#ffd166}.map-filter[data-map-quality].q5.active{color:#ff8c69}.map-filter[data-map-type="food"].active{color:#83e69a}.map-filter[data-map-type="build"].active{color:#a7d7e7}.map-filter[data-map-type="fuel"].active{color:#ffb27e}.map-filter[data-map-type="ore"].active{color:#d3b4ff}\n.hud-chip{position:absolute;top:5px;z-index:4;background:rgba(5,8,10,.84);border:1px solid var(--line);border-radius:7px;padding:5px 6px;pointer-events:none}#cornerHud{left:5px}#scanHud{right:5px;min-width:120px}.hud-chip strong{display:block;font-size:9px}.hud-chip span{font-size:8px;color:var(--muted)}.scan-progress{height:3px;margin-top:3px}.scan-progress i{background:var(--survey)}\n.toast{position:absolute;left:50%;top:7px;transform:translateX(-50%);z-index:30;background:#101820;border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:9px;max-width:85%;text-align:center}.error-badge{position:absolute;right:5px;bottom:5px;z-index:35;background:#4d1111;border-color:#ff7777;color:#fff;font-size:9px;font-weight:800}\n@media(max-width:370px){:root{--map-toolbar-height:28px}.map-view-toggle button{padding:2px 6px;font-size:6.4px}.map-filter-toggle{padding:2px 6px;font-size:6.2px}.map-filter-category{padding:2px 6px;font-size:5.8px}.map-filter,.map-filter-bulk{font-size:5.6px;padding:2px 4px;min-height:20px}.map-filter-options{gap:1px}}\n''')

          # The app shell allocates all remaining height to main; main decides its own map geometry.
          p=Path('css/app.css');s=p.read_text()
          old='#app{height:100vh;height:100dvh;display:grid;grid-template-rows:auto minmax(160px,1fr) auto;overflow:hidden}'
          new='#app{height:100vh;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden}'
          if old not in s: raise SystemExit('app grid rule not found')
          p.write_text(s.replace(old,new,1))

          # Map toggle styling now belongs to world.css, not land.css.
          p=Path('css/land.css');s=p.read_text()
          s,n=re.subn(r'^\.map-view-toggle.*?(?=\.landing-choice-grid)', '', s, count=1, flags=re.S)
          if n!=1: raise SystemExit(f'land toggle style removal count {n}')
          p.write_text(s)

          # General overlays are siblings of the canvas viewport, not canvas children.
          p=Path('index.html');s=p.read_text()
          s=s.replace('<div id="mapFilterHost"></div>','',1)
          old='<div id="toast" class="toast hidden"></div><button id="errorBadge" class="error-badge hidden">ERROR LOG</button><section id="tilePanel" class="panel tile-panel hidden"></section><section id="modal" class="panel modal hidden"></section></div></main>'
          new='</div><div id="overlayRoot" aria-label="Application overlays"><div id="toast" class="toast hidden"></div><button id="errorBadge" class="error-badge hidden">ERROR LOG</button><section id="tilePanel" class="panel tile-panel hidden"></section><section id="modal" class="panel modal hidden"></section></div></main>'
          if old not in s: raise SystemExit('overlay source structure not found')
          s=s.replace(old,new,1)
          s=s.replace('<script type="module" src="./js/ui/world-view-hotfix.js?v=5.5.6"></script>','',1)
          s=s.replace('./css/app.css?v=5.5.5','./css/app.css?v=5.6.0',1)
          s=s.replace('./css/world.css?v=5.5.5','./css/world.css?v=5.6.0',1)
          s=s.replace('./css/land.css?v=5.5.5','./css/land.css?v=5.6.0',1)
          s=s.replace('./js/app.js?v=5.5.5','./js/app.js?v=5.6.0',1)
          p.write_text(s)

          # App explicitly selects the v5.6 presentation composition. Domain graph remains stable.
          p=Path('js/app.js');s=p.read_text()
          old='import { WorldView } from "./ui/world-view.js?v=5.5.5";'
          if old not in s: raise SystemExit('WorldView import not found')
          s=s.replace(old,'import { WorldView } from "./ui/world-view-v56.js?v=5.6.0";',1)
          s=s.replace('import { TradeUI } from "./ui/v55-trade-ui.js?v=5.5.5";','import { TradeUI } from "./ui/v55-trade-ui.js?v=5.6.0";',1)
          s=s.replace('build:"5.5.5"','build:"5.6.0"')
          p.write_text(s)

          # UIController is the single owner of speed-button input. Trade UI may render disabled state but may not rebind clicks.
          p=Path('js/ui/trade-ui.js');s=p.read_text()
          s,n=re.subn(r'  constructor\(\{state,trade,repo,ui\}\)\{.*?\}\n  price', '  constructor({state,trade,repo,ui}){Object.assign(this,{state,trade,repo,ui});this.button=document.querySelector("#tradeBtn");this.button.onclick=()=>state.trade.active?this.open():this.status();}\n  price', s, count=1, flags=re.S)
          if n!=1: raise SystemExit(f'base trade constructor replacement {n}')
          p.write_text(s)

          p=Path('js/ui/industry-trade-ui.js');s=p.read_text().replace('./trade-ui.js?v=5.5.5','./trade-ui.js?v=5.6.0',1);p.write_text(s)

          p=Path('js/ui/v55-trade-ui.js');s=p.read_text()
          s=s.replace('./industry-trade-ui.js?v=5.5.5','./industry-trade-ui.js?v=5.6.0',1)
          s,n=re.subn(r'  constructor\(opts\)\{.*?\}\n  render', '  constructor(opts){super(opts);this.onDepart=opts.onDepart;this.gameLog=opts.gameLog;}\n  render', s, count=1, flags=re.S)
          if n!=1: raise SystemExit(f'v55 trade constructor replacement {n}')
          p.write_text(s)

          p=Path('js/core/diagnostics.js');s=p.read_text().replace('5.5.5-global-time-workforce-colony-land','5.6.0-presentation-architecture',1);p.write_text(s)

          # Remove the runtime prototype/CSS hotfix entirely.
          Path('js/ui/world-view-hotfix.js').unlink()
          Path('tests/map-layout-hotfix.test.js').unlink()

          # Update focused regression tests to assert architectural ownership as well as behaviour.
          Path('tests/map-view-toggle.test.js').write_text('''import assert from "node:assert/strict";\nimport fs from "node:fs";\nconst read=p=>fs.readFileSync(new URL(`../${p}`,import.meta.url),"utf8");\nconst index=read("index.html"),controls=read("js/ui/map-controls.js"),world=read("css/world.css"),land=read("css/land.css");\nassert.match(index,/id="mapViewHost"/);\nassert.doesNotMatch(index,/mapFilterHost/);\nassert.match(controls,/class MapControls/);\nassert.match(controls,/dataMapView|dataset\.mapView/);\nassert.match(controls,/FILTERS/);\nassert.match(world,/#worldShell\{[^}]*grid-template-rows:var\(--map-toolbar-height\) minmax\(0,1fr\)/);\nassert.match(world,/\.map-view-toggle\{/);\nassert.doesNotMatch(land,/\.map-view-toggle\{/);\nconsole.log("persistent single-row map controls regression test passed");\n''')

          Path('tests/compact-resource-filters.test.js').write_text('''import assert from "node:assert/strict";\nimport fs from "node:fs";\nconst read=p=>fs.readFileSync(new URL(`../${p}`,import.meta.url),"utf8");\nconst controls=read("js/ui/map-controls.js"),view=read("js/ui/world-view-v56.js"),css=read("css/world.css");\nassert.match(controls,/filtersOpen=false/);\nassert.match(controls,/filterCategory=null/);\nassert.match(controls,/mapFilterToggle/);\nassert.match(controls,/dataFilterCategory|filterCategory/);\nassert.match(controls,/panel\.classList\.toggle\("hidden",!filtering\)/);\nassert.match(view,/canvas\.style\.removeProperty\("width"\)/);\nassert.match(view,/canvas\.style\.removeProperty\("height"\)/);\nassert.doesNotMatch(view,/canvas\.style\.width\s*=/);\nassert.doesNotMatch(view,/canvas\.style\.height\s*=/);\nassert.match(css,/\.map-filter-options\{[^}]*flex-wrap:nowrap[^}]*overflow-x:auto/);\nassert.match(css,/\.map-filter-tabs\{[^}]*overflow-x:auto/);\nconsole.log("compact in-toolbar resource filters regression test passed");\n''')

          Path('tests/map-filters.test.js').write_text('''import assert from "node:assert/strict";\nimport { readFileSync } from "node:fs";\nimport { WorldView } from "../js/ui/world-view.js";\nconst view=Object.create(WorldView.prototype);view.state={company:{tech:{mining:2}}};view.technology={canExploit:(_state,tile)=>(tile.requiredMiningLevel||1)<=2};view.filters={developed:true,notDeveloped:true,locked:true};view.typeFilters={food:true,build:true,fuel:true,ore:true};\nconst unsurveyed={revealed:false,developed:false,depleted:false},developed={revealed:true,developed:true,depleted:false,requiredMiningLevel:6,type:"ore"},available={revealed:true,developed:false,depleted:false,requiredMiningLevel:2,type:"food"},locked={revealed:true,developed:false,depleted:false,requiredMiningLevel:3,type:"fuel"},depleted={revealed:true,developed:false,depleted:true,requiredMiningLevel:8,type:"build"};\nassert.equal(view.tileFilterBucket(unsurveyed),null);assert.equal(view.tileFilterBucket(developed),"developed");assert.equal(view.tileFilterBucket(available),"notDeveloped");assert.equal(view.tileFilterBucket(locked),"locked");assert.equal(view.tileFilterBucket(depleted),"notDeveloped");view.filters.developed=false;assert.equal(view.isTileVisible(developed,4,4),false);assert.equal(view.isTileVisible(available,4,4),true);view.filters.notDeveloped=false;assert.equal(view.isTileVisible(available,4,4),false);view.filters.locked=false;assert.equal(view.isTileVisible(locked,4,4),false);assert.equal(view.isTileVisible(unsurveyed,4,4),true);assert.equal(view.isTileVisible(locked,0,0),true);view.filters={developed:true,notDeveloped:true,locked:true};view.typeFilters.ore=false;assert.equal(view.isTileVisible(developed,2,2),false);assert.equal(view.isTileVisible(available,2,2),true);\nconst controls=readFileSync(new URL("../js/ui/map-controls.js",import.meta.url),"utf8"),defs=readFileSync(new URL("../js/ui/map-filter-definitions.js",import.meta.url),"utf8"),css=readFileSync(new URL("../css/world.css",import.meta.url),"utf8");for(const label of["DEVELOPED","NOT DEVELOPED","LOCKED","FOOD","BUILD","FUEL","ORE"])assert.ok(defs.includes(label),`Missing filter definition: ${label}`);for(const label of["STATE","TYPE","SIZE","QUALITY","ALL","CLEAR"])assert.ok(controls.includes(label),`Missing filter control: ${label}`);assert.match(css,/\.map-filter-options/);\nconsole.log("MineIT map filters test passed");\n''')

          Path('tests/presentation-architecture.test.js').write_text('''import assert from "node:assert/strict";\nimport fs from "node:fs";\nconst read=p=>fs.readFileSync(new URL(`../${p}`,import.meta.url),"utf8");\nconst index=read("index.html"),appCss=read("css/app.css"),worldCss=read("css/world.css"),base=read("js/ui/world-view.js"),view=read("js/ui/world-view-v56.js"),controls=read("js/ui/map-controls.js"),app=read("js/app.js"),ui=read("js/ui/ui-controller.js"),trade=read("js/ui/trade-ui.js"),v55Trade=read("js/ui/v55-trade-ui.js");\nassert.ok(!fs.existsSync(new URL("../js/ui/world-view-hotfix.js",import.meta.url)),"runtime map hotfix must be removed");\nassert.doesNotMatch(index,/world-view-hotfix/);\nassert.match(index,/id="overlayRoot"/);\nassert.doesNotMatch(index,/mapFilterHost/);\nassert.match(app,/world-view-v56\.js\?v=5\.6\.0/);\nassert.match(view,/extends CanvasWorldView/);\nassert.match(view,/new MapControls/);\nassert.doesNotMatch(view,/prototype\./);\nassert.doesNotMatch(view,/createElement\("style"\)/);\nassert.doesNotMatch(base,/bindViewToggle\(\)/);\nassert.doesNotMatch(base,/bindFilters\(\)/);\nassert.doesNotMatch(base,/filterHost/);\nassert.doesNotMatch(base,/canvas\.style\.width\s*=/);\nassert.doesNotMatch(base,/canvas\.style\.height\s*=/);\nassert.match(controls,/class MapControls/);\nassert.match(appCss,/grid-template-rows:auto minmax\(0,1fr\) auto/);\nassert.doesNotMatch(appCss,/minmax\(160px,1fr\)/);\nassert.match(worldCss,/#overlayRoot\{[^}]*pointer-events:none/);\nassert.match(worldCss,/#overlayRoot>\.panel,#overlayRoot>\.error-badge\{pointer-events:auto\}/);\nassert.match(ui,/querySelectorAll\("\[data-speed\]"\).*button\.onclick/s);\nassert.doesNotMatch(trade,/querySelectorAll\("\[data-speed\]"\).*onclick/s);\nassert.doesNotMatch(v55Trade,/querySelectorAll\("\[data-speed\]"\).*onclick/s);\nconsole.log("presentation architecture ownership test passed");\n''')

          # Startup/cache test now distinguishes stable domain graph from the v5.6 presentation graph.
          Path('tests/startup-coherence.test.js').write_text('''import assert from "node:assert/strict";\nimport { readFileSync } from "node:fs";\nconst read=p=>readFileSync(new URL(`../${p}`,import.meta.url),"utf8");\nconst index=read("index.html"),app=read("js/app.js"),ui=read("js/ui/ui-controller.js");\nassert.match(index,/js\/app\.js\?v=5\.6\.0/);\nfor(const css of["app","world","land"])assert.match(index,new RegExp(`css/${css}\\.css\\?v=5\\.6\\.0`));\nfor(const css of["panels","portfolio","trade-quality","ui-enhancements"])assert.match(index,new RegExp(`css/${css}\\.css\\?v=5\\.5\\.5`));\nassert.doesNotMatch(index,/world-view-hotfix/);\nassert.match(index,/id="overlayRoot"/);\nfor(const module of["game-state","portfolio-service","resource-service","inventory-service","collection-service","colony-service","trade-service","land-service","development-service","world-service","site-service","technology-service","survey-service","simulation-engine","game-log-service","transport-service"])assert.match(app,new RegExp(`domain/${module}\\.js\\?v=5\\.5\\.5`));\nassert.match(app,/ui\/world-view-v56\.js\?v=5\.6\.0/);\nassert.match(app,/ui\/v55-trade-ui\.js\?v=5\.6\.0/);\nassert.match(app,/ui\/ui-controller\.js\?v=5\.5\.5/);\nassert.match(ui,/land-ui\.js\?v=5\.5\.5/);\nassert.match(app,/advanceGlobalDate/);assert.match(app,/processPendingShipEvent/);assert.match(app,/startup failed/);\nassert.ok(read("js/core/diagnostics.js").includes("5.6.0-presentation-architecture"));\nconsole.log("MineIT v5.6 presentation / v5.5 domain startup coherence test passed");\n''')

          # Browser interaction probe: geometry, view transitions and actual footer actions.
          Path('tests/mobile-layout-probe.html').write_text('''<!doctype html><meta charset="utf-8"><style>html,body,#frame{margin:0;width:100%;height:100%;border:0;overflow:hidden}#result{position:fixed;z-index:9999;top:0;left:0;background:white;color:black;font:12px monospace}</style><div id="result">WAIT</div><iframe id="frame" src="../index.html"></iframe><script>\nconst sleep=ms=>new Promise(r=>setTimeout(r,ms));\nasync function run(){const out=document.querySelector('#result'),frame=document.querySelector('#frame');await new Promise(r=>frame.addEventListener('load',r,{once:true}));await sleep(2500);const d=frame.contentDocument,fail=[];const checkMap=label=>{const v=d.querySelector('#worldViewport'),c=d.querySelector('#world');if(!v||!c){fail.push(label+':missing map');return 0}const vr=v.getBoundingClientRect(),cr=c.getBoundingClientRect();if(vr.height<60)fail.push(label+':viewport '+vr.height);if(Math.abs(vr.top-cr.top)>1||Math.abs(vr.bottom-cr.bottom)>1||Math.abs(vr.left-cr.left)>1||Math.abs(vr.right-cr.right)>1)fail.push(label+':canvas escapes viewport');return vr.height};\nconst choice=d.querySelector('[data-land-choice]');if(choice){choice.click();await sleep(700)}const land=d.querySelector('[data-map-view="land"]'),res=d.querySelector('[data-map-view="resource"]');if(!land||!res)fail.push('map view buttons missing');let h0=checkMap('land');if(res){res.click();await sleep(120);const h1=checkMap('resource');if(Math.abs(h1-h0)>2)fail.push('resource changes map height '+h0+'->'+h1);const filter=d.querySelector('#mapFilterToggle');if(!filter)fail.push('filter missing');else{filter.click();await sleep(100);const h2=checkMap('filters');if(Math.abs(h2-h1)>2)fail.push('filters change map height');const type=d.querySelector('[data-filter-category="type"]');if(type){type.click();await sleep(80);const h3=checkMap('type');if(Math.abs(h3-h1)>2)fail.push('type filters change map height')}let back=d.querySelector('[data-filter-back]');if(back){back.click();await sleep(40);back=d.querySelector('[data-filter-back]');back?.click();await sleep(60)}}}if(land){land.click();await sleep(80);checkMap('land-return')}\nfor(const b of d.querySelectorAll('.app-footer button')){const r=b.getBoundingClientRect();if(r.width<1||r.height<1)continue;const hit=d.elementFromPoint(r.left+r.width/2,r.top+r.height/2);if(!(hit===b||b.contains(hit)))fail.push('footer blocked:'+b.id+':'+(hit?.id||hit?.className||hit?.tagName))}\nfor(const id of['collectionBtn','tradeBtn','colonyBtn','coloniesBtn','techBtn','goalsBtn','menuBtn']){const b=d.getElementById(id);if(!b||b.disabled)continue;b.click();await sleep(60);const modal=d.getElementById('modal');if(!modal||modal.classList.contains('hidden'))fail.push(id+':did not open modal');const close=modal?.querySelector('[data-close]');close?.click();await sleep(25)}\nout.textContent=fail.length?'FAIL '+fail.join(' | '):'PASS presentation layout, map transitions and footer actions'}run().catch(e=>document.querySelector('#result').textContent='FAIL '+e.stack);\n</script>''')

          package=json.loads(Path('package.json').read_text())
          package['version']='5.6.0'
          tests=package['scripts']['test'].replace(' && node tests/map-layout-hotfix.test.js','')
          if 'presentation-architecture.test.js' not in tests: tests+=' && node tests/presentation-architecture.test.js'
          package['scripts']['test']=tests
          Path('package.json').write_text(json.dumps(package,indent=2)+"\n")
          PY
      - name: Unit and regression tests
        run: npm test
      - name: Mobile browser architecture probe
        run: |
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/mineit-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$chrome"
          for size in 360,640 375,667 390,844 412,915 915,412; do
            "$chrome" --headless --no-sandbox --disable-gpu --window-size="$size" --virtual-time-budget=9000 --dump-dom http://127.0.0.1:8123/tests/mobile-layout-probe.html >"/tmp/probe-$size.html" 2>"/tmp/probe-$size.log"
            grep -q 'PASS presentation layout, map transitions and footer actions' "/tmp/probe-$size.html" || { cat "/tmp/probe-$size.html"; cat "/tmp/probe-$size.log"; exit 1; }
          done
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html package.json css/app.css css/world.css css/land.css js/app.js js/core/diagnostics.js js/ui/map-controls.js js/ui/map-filter-definitions.js js/ui/world-view.js js/ui/world-view-v56.js js/ui/trade-ui.js js/ui/industry-trade-ui.js js/ui/v55-trade-ui.js tests/startup-coherence.test.js tests/map-view-toggle.test.js tests/compact-resource-filters.test.js tests/map-filters.test.js tests/presentation-architecture.test.js tests/mobile-layout-probe.html js/ui/world-view-hotfix.js tests/map-layout-hotfix.test.js
          git diff --cached --check
          git commit -m "Refactor presentation and map architecture"
          git push origin HEAD:refactor/presentation-architecture
