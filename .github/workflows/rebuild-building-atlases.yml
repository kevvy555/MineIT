name: Rebuild building atlases

on:
  push:
    paths:
      - 'assets/art/development/**/originals/*.png'
      - 'tools/build-building-atlases.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: building-atlases-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - run: python tools/build-building-atlases.py
      - name: Commit rebuilt atlases
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/art/development/*/*-levels-256.webp
          if git diff --cached --quiet; then
            echo "No atlas changes to commit."
            exit 0
          fi
          git commit -m "Rebuild high-resolution building atlases"
          git push
