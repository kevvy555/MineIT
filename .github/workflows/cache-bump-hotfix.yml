name: Cache Bump Hotfix

on:
  push:
    branches:
      - hotfix/browser-startup-cache
  pull_request:
    branches:
      - develop

permissions:
  contents: write

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/browser-startup-cache
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bump browser cache graph to 5.5.1
        run: |
          python3 - <<'PY'
          from pathlib import Path
          allowed = {'.js', '.html', '.json', '.css', '.md', '.yml', '.yaml'}
          changed = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.suffix.lower() not in allowed:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if '5.5.0' not in text:
                  continue
              path.write_text(text.replace('5.5.0', '5.5.1'), encoding='utf-8')
              changed.append(str(path))
          print('\n'.join(changed))
          PY
          npm test
      - name: Commit cache-version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mapfile -t files < <(git diff --name-only)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No cache-version changes needed"
            exit 0
          fi
          git add -- "${files[@]}"
          git commit -m "Bump browser cache graph to 5.5.1"
          git push origin HEAD:hotfix/browser-startup-cache
