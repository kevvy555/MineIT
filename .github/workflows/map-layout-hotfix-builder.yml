name: Map Layout Hotfix Builder

on:
  push:
    branches:
      - hotfix/map-layout-and-footer

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/map-layout-and-footer
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply hotfix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('js/ui/world-view.js')
          s=p.read_text()
          s=s.replace('this.filtersOpen=false;this.filterCategory="type";','this.filtersOpen=false;this.filterCategory=null;',1)

          s,n=re.subn(r'  bindViewToggle\(\)\{.*?\n  \}\n  filterDisabledCount\(\)', '''  bindViewToggle(){
    const host=document.querySelector("#mapViewHost")||this.shell,old=document.querySelector("#mapViewToggle"),oldFilter=document.querySelector("#mapFilterToggle");if(old)old.remove();if(oldFilter)oldFilter.remove();this.toolbarHost=host;
    const wrap=document.createElement("div");wrap.id="mapViewToggle";wrap.className="map-view-toggle";
    for(const[key,label]of[["land","LAND"],["resource","RESOURCES"]]){const b=document.createElement("button");b.type="button";b.dataset.mapView=key;b.textContent=label;b.onclick=()=>{if(!this.state.colony?.land)return;this.state.colony.land.view=key;this.filtersOpen=false;this.filterCategory=null;this.syncView();this.safeDraw();};wrap.appendChild(b);}
    const filter=document.createElement("button");filter.id="mapFilterToggle";filter.className="map-filter-toggle";filter.type="button";filter.onclick=()=>{if(this.view()!=="resource")return;this.filtersOpen=true;this.filterCategory=null;this.syncFilters();this.syncView();};
    host.appendChild(wrap);host.appendChild(filter);this.viewToggle=wrap;this.filterToggle=filter;this.syncView();
  }
  filterDisabledCount()''',s,flags=re.S)
          if n!=1: raise SystemExit(f'bindViewToggle replacement count {n}')

          s,n=re.subn(r'  syncView\(\)\{.*?\n  bindFilters\(\)\{', '''  syncView(){const view=this.view(),selecting=this.state.status==="site-selection",resource=view==="resource",off=this.filterDisabledCount(),filtering=resource&&this.filtersOpen&&!selecting&&!!this.land;this.viewToggle?.querySelectorAll("[data-map-view]").forEach(b=>b.classList.toggle("active",b.dataset.mapView===view));this.viewToggle?.classList.toggle("hidden",filtering||selecting||!this.land);if(this.filterToggle){this.filterToggle.textContent=off?`FILTERS • ${off} OFF`:"FILTERS";this.filterToggle.classList.toggle("active",filtering);this.filterToggle.classList.toggle("hidden",filtering||!resource||selecting||!this.land);}this.filterBar?.classList.toggle("hidden",!filtering);this.filterHost?.classList.add("hidden");}
  bindFilters(){''',s,flags=re.S)
          if n!=1: raise SystemExit(f'syncView replacement count {n}')

          s,n=re.subn(r'  bindFilters\(\)\{.*?\n  \}\n  syncFilters\(\)\{', '''  bindFilters(){
    const existing=document.querySelector("#mapFilters");if(existing)existing.remove();const bar=document.createElement("div");bar.id="mapFilters";bar.className="map-filters hidden";bar.setAttribute("aria-label","Map tile filters");
    const back=document.createElement("button");back.type="button";back.className="map-filter-back";back.dataset.filterBack="1";back.onclick=()=>{if(this.filterCategory){this.filterCategory=null;this.syncFilters();}else{this.filtersOpen=false;this.syncView();}};bar.appendChild(back);
    const tabs=document.createElement("div");tabs.className="map-filter-tabs";for(const[key,label]of[["state","STATE"],["type","TYPE"],["size","SIZE"],["quality","QUALITY"]]){const button=document.createElement("button");button.type="button";button.className="map-filter-category";button.dataset.filterCategory=key;button.textContent=label;button.onclick=()=>{this.filterCategory=key;this.syncFilters();};tabs.appendChild(button);}bar.appendChild(tabs);
    const addGroup=(key,attribute,items,filters)=>{const row=document.createElement("div");row.className="map-filter-group hidden";row.dataset.filterGroup=key;const options=document.createElement("div");options.className="map-filter-options";options.innerHTML='<button type="button" class="map-filter-bulk" data-map-bulk="all">ALL</button><button type="button" class="map-filter-bulk" data-map-bulk="clear">CLEAR</button>';for(const item of items){const itemKey=item.key??item[0],itemText=item.label?.toUpperCase?.()??item[1],button=document.createElement("button");button.type="button";button.className=`map-filter active ${item.className||""}`;button.dataset[attribute]=itemKey;button.textContent=itemText;button.setAttribute("aria-pressed","true");if(item.min)button.title=`Q${item.min}–${item.max}`;button.onclick=()=>{filters[itemKey]=!filters[itemKey];this.syncFilters();this.safeDraw();};options.appendChild(button);}options.querySelector('[data-map-bulk="all"]').onclick=()=>{for(const k of Object.keys(filters))filters[k]=true;this.syncFilters();this.safeDraw();};options.querySelector('[data-map-bulk="clear"]').onclick=()=>{for(const k of Object.keys(filters))filters[k]=false;this.syncFilters();this.safeDraw();};row.appendChild(options);bar.appendChild(row);};
    addGroup("state","mapFilter",[["developed","DEVELOPED"],["notDeveloped","NOT DEVELOPED"],["locked","LOCKED"]],this.filters);
    addGroup("type","mapType",TYPE_FILTERS,this.typeFilters);
    addGroup("size","mapSize",SIZE_FILTERS,this.sizeFilters);
    addGroup("quality","mapQuality",this.resources.qualityBands(),this.qualityFilters);
    (this.toolbarHost||document.querySelector("#mapViewHost")||this.shell).appendChild(bar);this.filterBar=bar;this.filterBack=back;this.filterTabs=tabs;this.syncFilters();this.syncView();
  }
  syncFilters(){''',s,flags=re.S)
          if n!=1: raise SystemExit(f'bindFilters replacement count {n}')

          s,n=re.subn(r'  syncFilters\(\)\{.*?\n  tileFilterBucket\(', '''  syncFilters(){if(!this.filterBar)return;const sync=(selector,filters,key)=>this.filterBar.querySelectorAll(selector).forEach(button=>{const active=filters[button.dataset[key]]!==false;button.classList.toggle("active",active);button.setAttribute("aria-pressed",String(active));});sync("[data-map-filter]",this.filters,"mapFilter");sync("[data-map-type]",this.typeFilters,"mapType");sync("[data-map-size]",this.sizeFilters,"mapSize");sync("[data-map-quality]",this.qualityFilters,"mapQuality");const inGroup=!!this.filterCategory;this.filterTabs?.classList.toggle("hidden",inGroup);this.filterBar.querySelectorAll("[data-filter-category]").forEach(button=>button.classList.toggle("active",button.dataset.filterCategory===this.filterCategory));this.filterBar.querySelectorAll("[data-filter-group]").forEach(group=>group.classList.toggle("hidden",!inGroup||group.dataset.filterGroup!==this.filterCategory));if(this.filterBack)this.filterBack.textContent=inGroup?"BACK":"DONE";if(this.filterToggle){const off=this.filterDisabledCount();this.filterToggle.textContent=off?`FILTERS • ${off} OFF`:"FILTERS";}}
  tileFilterBucket(''',s,flags=re.S)
          if n!=1: raise SystemExit(f'syncFilters replacement count {n}')

          s,n=re.subn(r'  resize\(\)\{.*?\n  safeDraw\(\)', '''  resize(){const r=this.shell.getBoundingClientRect(),header=document.querySelector(".app-header")?.getBoundingClientRect().height||0,footer=document.querySelector(".app-footer")?.getBoundingClientRect().height||0,viewport=window.visualViewport?.height||window.innerHeight||0,width=Math.max(1,r.width||window.innerWidth||320),fallbackHeight=Math.max(1,viewport-header-footer),height=Math.max(1,r.height||fallbackHeight),dpr=Math.min(2,Math.max(1,devicePixelRatio||1));this.canvas.width=Math.max(1,Math.round(width*dpr));this.canvas.height=Math.max(1,Math.round(height*dpr));this.canvas.style.removeProperty("width");this.canvas.style.removeProperty("height");this.ctx.setTransform(dpr,0,0,dpr,0,0);this.width=width;this.height=height;this.cell=Math.max(1,Math.min(this.width,this.height)/CONFIG.GRID_SIZE);this.safeDraw();}
  safeDraw()''',s,flags=re.S)
          if n!=1: raise SystemExit(f'resize replacement count {n}')
          p.write_text(s)

          Path('css/world.css').write_text('''#worldShell{display:grid;grid-template-rows:30px minmax(0,1fr);overflow:hidden;min-height:160px;background:#000}\n#mapViewHost{position:relative;z-index:20;display:flex;align-items:center;justify-content:flex-start;gap:4px;height:30px;min-height:30px;padding:2px 3px;background:#05080a;border-bottom:1px solid var(--line);touch-action:manipulation;overflow:hidden}\n#mapFilterHost{display:none!important}\n#worldViewport{position:relative;overflow:hidden;touch-action:none;min-height:0}\n#world{position:absolute;inset:0;width:100%;height:100%;background:#000}\n.hud-chip{position:absolute;top:5px;z-index:4;background:rgba(5,8,10,.84);border:1px solid var(--line);border-radius:7px;padding:5px 6px;pointer-events:none}\n#cornerHud{left:5px}\n#scanHud{right:5px;min-width:120px}\n.hud-chip strong{display:block;font-size:9px}\n.hud-chip span{font-size:8px;color:var(--muted)}\n.scan-progress{height:3px;margin-top:3px}\n.scan-progress i{background:var(--survey)}\n.map-filter-toggle{margin-left:auto;min-height:25px;padding:3px 8px;font-size:7px;font-weight:900;letter-spacing:.04em;background:#0b1116;border-color:#26333d;color:var(--muted)}.map-filter-toggle.active{background:#17313d;border-color:var(--accent);color:#effaff}.map-filters{display:flex;align-items:center;gap:2px;width:100%;min-width:0;height:25px;padding:0;background:#05080a;touch-action:manipulation;overflow:hidden}.map-filter-back{flex:0 0 auto;min-height:21px;padding:2px 6px;font-size:6px;font-weight:900;background:#111a20;border-color:#31414c;color:#c9d8df}.map-filter-tabs{display:flex;flex:1 1 auto;gap:2px;min-width:0;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none}.map-filter-tabs::-webkit-scrollbar,.map-filter-options::-webkit-scrollbar{display:none}.map-filter-category{flex:1 0 auto;min-height:21px;padding:2px 7px;font-size:6.2px;font-weight:900;background:#0b1116;border-color:#26333d;color:var(--muted)}.map-filter-category.active{background:#13222c;border-color:var(--accent);color:#e6f6ff}.map-filter-group{display:flex;flex:1 1 auto;min-width:0;overflow:hidden}.map-filter-options{display:flex;flex:1 1 auto;flex-wrap:nowrap;gap:2px;min-width:0;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none}.map-filter,.map-filter-bulk{flex:0 0 auto;min-height:21px;padding:2px 5px;font-size:6.1px;font-weight:800;letter-spacing:.01em;background:#0b1116;border-color:#26333d;color:var(--muted)}\n.map-filter{opacity:.36}.map-filter.active{opacity:1;background:#13222c;border-color:var(--accent);color:#e6f6ff;box-shadow:0 0 0 1px rgba(118,198,255,.18) inset}.map-filter-bulk{opacity:.8;color:#8fa1aa;border-style:dashed}.map-filter-bulk:active{background:#18242c}\n.map-filter[data-map-filter="locked"].active{border-color:var(--warn);color:var(--warn);box-shadow:0 0 0 1px rgba(255,209,102,.16) inset}.map-filter[data-map-quality].active{background:#10171c}.map-filter[data-map-quality].q0.active{color:#d7e0e5}.map-filter[data-map-quality].q1.active{color:#8fdca3}.map-filter[data-map-quality].q2.active{color:#65c8ff}.map-filter[data-map-quality].q3.active{color:#c69cff}.map-filter[data-map-quality].q4.active{color:#ffd166}.map-filter[data-map-quality].q5.active{color:#ff8c69}.map-filter[data-map-type="food"].active{color:#83e69a}.map-filter[data-map-type="build"].active{color:#a7d7e7}.map-filter[data-map-type="fuel"].active{color:#ffb27e}.map-filter[data-map-type="ore"].active{color:#d3b4ff}\n.toast{position:absolute;left:50%;top:7px;transform:translateX(-50%);z-index:30;background:#101820;border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:9px;pointer-events:none;max-width:85%;text-align:center}\n.error-badge{position:absolute;right:5px;bottom:5px;z-index:35;background:#4d1111;border-color:#ff7777;color:#fff;font-size:9px;font-weight:800}\n@media(max-width:370px){#worldShell{grid-template-rows:28px minmax(0,1fr)}#mapViewHost{height:28px;min-height:28px}.map-filter-toggle{padding:2px 6px;font-size:6.2px}.map-filter-category{padding:2px 6px;font-size:5.8px}.map-filter,.map-filter-bulk{font-size:5.6px;padding:2px 4px;min-height:20px}.map-filter-options{gap:1px}}\n''')

          Path('tests/compact-resource-filters.test.js').write_text('''import assert from "node:assert/strict";\nimport fs from "node:fs";\nconst read=p=>fs.readFileSync(new URL(`../${p}`,import.meta.url),"utf8");\nconst view=read("js/ui/world-view.js"),css=read("css/world.css");\nassert.match(view,/this\\.filtersOpen=false;this\\.filterCategory=null/);\nassert.match(view,/this\\.toolbarHost=host/);\nassert.match(view,/data\\.filterBack|filterBack/);\nassert.match(view,/this\\.filterHost\\?\\.classList\\.add\\("hidden"\\)/);\nassert.match(view,/appendChild\\(bar\\)/);\nassert.match(view,/this\\.canvas\\.style\\.removeProperty\\("width"\\)/);\nassert.match(view,/this\\.canvas\\.style\\.removeProperty\\("height"\\)/);\nassert.doesNotMatch(view,/this\\.canvas\\.style\\.width=/);\nassert.doesNotMatch(view,/this\\.canvas\\.style\\.height=/);\nassert.match(css,/#worldShell\\{[^}]*grid-template-rows:30px minmax\\(0,1fr\\)/);\nassert.match(css,/#mapFilterHost\\{display:none!important\\}/);\nassert.match(css,/\\.map-filters\\{[^}]*display:flex[^}]*height:25px/);\nassert.match(css,/\\.map-filter-options\\{[^}]*flex-wrap:nowrap[^}]*overflow-x:auto/);\nconsole.log("compact one-row resource filters / contained map regression test passed");\n''')

          Path('tests/mobile-layout-regression.test.js').write_text('''import assert from "node:assert/strict";\nimport fs from "node:fs";\nconst read=p=>fs.readFileSync(new URL(`../${p}`,import.meta.url),"utf8");\nconst view=read("js/ui/world-view.js"),css=read("css/world.css"),app=read("css/app.css");\nassert.match(css,/#world\\{position:absolute;inset:0;width:100%;height:100%/);\nassert.match(css,/#worldViewport\\{[^}]*overflow:hidden/);\nassert.match(css,/#mapViewHost\\{[^}]*height:30px/);\nassert.match(app,/\\.app-header,\\.app-footer\\{[^}]*z-index:20/);\nassert.doesNotMatch(view,/canvas\\.style\\.(?:width|height)\\s*=/);\nconsole.log("mobile map containment/footer hit-area source regression test passed");\n''')

          Path('tests/mobile-layout-probe.html').write_text('''<!doctype html><meta charset="utf-8"><style>html,body,#frame{margin:0;width:100%;height:100%;border:0;overflow:hidden}#result{position:fixed;z-index:9999;top:0;left:0;background:white;color:black;font:12px monospace}</style><div id="result">WAIT</div><iframe id="frame" src="../index.html"></iframe><script>\nconst sleep=ms=>new Promise(r=>setTimeout(r,ms));\nasync function run(){const out=document.querySelector('#result'),frame=document.querySelector('#frame');await new Promise(r=>frame.addEventListener('load',r,{once:true}));await sleep(2500);const d=frame.contentDocument;const fail=[];const checkMap=label=>{const v=d.querySelector('#worldViewport'),c=d.querySelector('#world');if(!v||!c){fail.push(label+':missing map');return 0}const vr=v.getBoundingClientRect(),cr=c.getBoundingClientRect();if(vr.height<80)fail.push(label+':viewport '+vr.height);if(Math.abs(vr.top-cr.top)>1||Math.abs(vr.bottom-cr.bottom)>1||Math.abs(vr.left-cr.left)>1||Math.abs(vr.right-cr.right)>1)fail.push(label+':canvas escapes viewport');return vr.height};const choice=d.querySelector('[data-land-choice]');if(choice){choice.click();await sleep(600)}const land=d.querySelector('[data-map-view="land"]'),res=d.querySelector('[data-map-view="resource"]');if(!land||!res)fail.push('map view buttons missing');let h0=checkMap('land');if(res){res.click();await sleep(150);let h1=checkMap('resource');if(Math.abs(h1-h0)>2)fail.push('resource changes map height '+h0+'->'+h1);const filter=d.querySelector('#mapFilterToggle');if(!filter)fail.push('filter button missing');else{filter.click();await sleep(150);let h2=checkMap('filters');if(Math.abs(h2-h1)>2)fail.push('filters change map height '+h1+'->'+h2);const type=d.querySelector('[data-filter-category="type"]');if(type){type.click();await sleep(100);let h3=checkMap('type filters');if(Math.abs(h3-h1)>2)fail.push('type filters change map height')}const back=d.querySelector('[data-filter-back]');if(back){if(d.querySelector('[data-filter-group="type"]:not(.hidden)')){back.click();await sleep(50)}back.click();await sleep(100)}}}if(land){land.click();await sleep(100);checkMap('land-return')}for(const b of d.querySelectorAll('.app-footer button')){const r=b.getBoundingClientRect();if(r.width<1||r.height<1)continue;const hit=d.elementFromPoint(r.left+r.width/2,r.top+r.height/2);if(!(hit===b||b.contains(hit)))fail.push('footer blocked:'+b.id+':'+(hit?.id||hit?.className||hit?.tagName))}out.textContent=fail.length?'FAIL '+fail.join(' | '):'PASS mobile layout and footer hit targets';}\nrun().catch(e=>document.querySelector('#result').textContent='FAIL '+e.stack);\n</script>''')

          pkg=Path('package.json');s=pkg.read_text();s=s.replace('node tests/compact-resource-filters.test.js','node tests/compact-resource-filters.test.js && node tests/mobile-layout-regression.test.js');pkg.write_text(s)

          # Bump the full text/module cache graph so existing phones cannot retain v5.5.5.
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.name=='map-layout-hotfix-builder.yml': continue
              if path.suffix.lower() not in {'.js','.html','.json','.css','.md','.yml','.yaml'}: continue
              try: data=path.read_text(encoding='utf-8')
              except UnicodeDecodeError: continue
              updated=data.replace('5.5.5','5.5.6').replace(r'5\.5\.5',r'5\.5\.6')
              if updated!=data: path.write_text(updated,encoding='utf-8')
          PY
          npm test
      - name: Mobile browser layout probe
        run: |
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/mineit-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$chrome"
          "$chrome" --headless --no-sandbox --disable-gpu --window-size=412,915 --virtual-time-budget=8000 --dump-dom http://127.0.0.1:8123/tests/mobile-layout-probe.html >/tmp/layout-probe.html 2>/tmp/layout-chrome.log
          grep -q 'PASS mobile layout and footer hit targets' /tmp/layout-probe.html || { cat /tmp/layout-probe.html; cat /tmp/layout-chrome.log; exit 1; }
      - name: Commit hotfix and remove builder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/map-layout-hotfix-builder.yml
          while IFS= read -r -d '' f; do git add -- "$f"; done < <(git diff --name-only -z)
          git commit -m "Fix map layout and footer interaction regression"
          git push origin HEAD:hotfix/map-layout-and-footer
