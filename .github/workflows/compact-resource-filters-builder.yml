name: Compact Resource Filters Builder

on:
  push:
    branches:
      - fix/compact-resource-filters

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/compact-resource-filters
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply compact resource filter redesign
        run: |
          python3 - <<'PY'
          from pathlib import Path

          view=Path('js/ui/world-view.js')
          text=view.read_text()

          old='this.qualityFilters=Object.fromEntries(this.resources.qualityBands().map(b=>[b.key,true]));\n    this.drawQueued=false;this.drawCount=0;this.assetReady=()=>this.safeDraw();this.icons.setOnReady?.(this.assetReady);'
          new='this.qualityFilters=Object.fromEntries(this.resources.qualityBands().map(b=>[b.key,true]));\n    this.filtersOpen=false;this.filterCategory="type";\n    this.drawQueued=false;this.drawCount=0;this.assetReady=()=>this.safeDraw();this.icons.setOnReady?.(this.assetReady);'
          if old not in text: raise SystemExit('constructor filter state marker missing')
          text=text.replace(old,new,1)

          old='''  bindViewToggle(){
    const host=document.querySelector("#mapViewHost")||this.shell,old=document.querySelector("#mapViewToggle");if(old)old.remove();
    const wrap=document.createElement("div");wrap.id="mapViewToggle";wrap.className="map-view-toggle";
    for(const[key,label]of[["land","LAND"],["resource","RESOURCES"]]){const b=document.createElement("button");b.type="button";b.dataset.mapView=key;b.textContent=label;b.onclick=()=>{if(!this.state.colony?.land)return;this.state.colony.land.view=key;this.syncView();this.safeDraw();};wrap.appendChild(b);}
    host.appendChild(wrap);this.viewToggle=wrap;this.syncView();
  }
  syncView(){const view=this.view(),selecting=this.state.status==="site-selection";this.viewToggle?.querySelectorAll("[data-map-view]").forEach(b=>b.classList.toggle("active",b.dataset.mapView===view));this.viewToggle?.classList.toggle("hidden",selecting||!this.land);this.filterHost?.classList.toggle("hidden",view!=="resource"||selecting);}
'''
          new='''  bindViewToggle(){
    const host=document.querySelector("#mapViewHost")||this.shell,old=document.querySelector("#mapViewToggle"),oldFilter=document.querySelector("#mapFilterToggle");if(old)old.remove();if(oldFilter)oldFilter.remove();
    const wrap=document.createElement("div");wrap.id="mapViewToggle";wrap.className="map-view-toggle";
    for(const[key,label]of[["land","LAND"],["resource","RESOURCES"]]){const b=document.createElement("button");b.type="button";b.dataset.mapView=key;b.textContent=label;b.onclick=()=>{if(!this.state.colony?.land)return;this.state.colony.land.view=key;this.filtersOpen=false;this.syncView();this.resize();this.safeDraw();};wrap.appendChild(b);}
    const filter=document.createElement("button");filter.id="mapFilterToggle";filter.className="map-filter-toggle";filter.type="button";filter.onclick=()=>{this.filtersOpen=!this.filtersOpen;this.syncView();this.resize();};
    host.appendChild(wrap);host.appendChild(filter);this.viewToggle=wrap;this.filterToggle=filter;this.syncView();
  }
  filterDisabledCount(){return[this.filters,this.typeFilters,this.sizeFilters,this.qualityFilters].reduce((total,group)=>total+Object.values(group||{}).filter(value=>value===false).length,0);}
  syncView(){const view=this.view(),selecting=this.state.status==="site-selection",resource=view==="resource",off=this.filterDisabledCount();this.viewToggle?.querySelectorAll("[data-map-view]").forEach(b=>b.classList.toggle("active",b.dataset.mapView===view));this.viewToggle?.classList.toggle("hidden",selecting||!this.land);if(this.filterToggle){this.filterToggle.textContent=off?`FILTERS • ${off} OFF`:"FILTERS";this.filterToggle.classList.toggle("active",this.filtersOpen);this.filterToggle.classList.toggle("hidden",!resource||selecting||!this.land);}this.filterHost?.classList.toggle("hidden",!resource||selecting||!this.filtersOpen);}
'''
          if old not in text: raise SystemExit('map view toggle/sync marker missing')
          text=text.replace(old,new,1)

          start=text.index('  bindFilters(){')
          end=text.index('  tileFilterBucket(',start)
          old=text[start:end]
          new='''  bindFilters(){
    const existing=this.filterHost.querySelector("#mapFilters");if(existing)existing.remove();const bar=document.createElement("div");bar.id="mapFilters";bar.className="map-filters";bar.setAttribute("aria-label","Map tile filters");
    const tabs=document.createElement("div");tabs.className="map-filter-tabs";for(const[key,label]of[["state","STATE"],["type","TYPE"],["size","SIZE"],["quality","QUALITY"]]){const button=document.createElement("button");button.type="button";button.className="map-filter-category";button.dataset.filterCategory=key;button.textContent=label;button.onclick=()=>{this.filterCategory=key;this.syncFilters();};tabs.appendChild(button);}bar.appendChild(tabs);
    const addGroup=(key,label,attribute,items,filters)=>{const row=document.createElement("div");row.className="map-filter-group";row.dataset.filterGroup=key;row.innerHTML=`<span class="map-filter-label">${label}</span><div class="map-filter-options"><button type="button" class="map-filter-bulk" data-map-bulk="all">ALL</button><button type="button" class="map-filter-bulk" data-map-bulk="clear">CLEAR</button></div>`;const options=row.querySelector(".map-filter-options");for(const item of items){const itemKey=item.key??item[0],itemText=item.label?.toUpperCase?.()??item[1],button=document.createElement("button");button.type="button";button.className=`map-filter active ${item.className||""}`;button.dataset[attribute]=itemKey;button.textContent=itemText;button.setAttribute("aria-pressed","true");if(item.min)button.title=`Q${item.min}–${item.max}`;button.onclick=()=>{filters[itemKey]=!filters[itemKey];this.syncFilters();this.safeDraw();};options.appendChild(button);}row.querySelector('[data-map-bulk="all"]').onclick=()=>{for(const itemKey of Object.keys(filters))filters[itemKey]=true;this.syncFilters();this.safeDraw();};row.querySelector('[data-map-bulk="clear"]').onclick=()=>{for(const itemKey of Object.keys(filters))filters[itemKey]=false;this.syncFilters();this.safeDraw();};bar.appendChild(row);};
    addGroup("state","STATE","mapFilter",[["developed","DEVELOPED"],["notDeveloped","NOT DEVELOPED"],["locked","LOCKED"]],this.filters);
    addGroup("type","TYPE","mapType",TYPE_FILTERS,this.typeFilters);
    addGroup("size","SIZE","mapSize",SIZE_FILTERS,this.sizeFilters);
    addGroup("quality","QUALITY","mapQuality",this.resources.qualityBands(),this.qualityFilters);
    this.filterHost.appendChild(bar);this.filterBar=bar;this.syncFilters();this.syncView();
  }
  syncFilters(){if(!this.filterBar)return;const sync=(selector,filters,key)=>this.filterBar.querySelectorAll(selector).forEach(button=>{const active=filters[button.dataset[key]]!==false;button.classList.toggle("active",active);button.setAttribute("aria-pressed",String(active));});sync("[data-map-filter]",this.filters,"mapFilter");sync("[data-map-type]",this.typeFilters,"mapType");sync("[data-map-size]",this.sizeFilters,"mapSize");sync("[data-map-quality]",this.qualityFilters,"mapQuality");this.filterBar.querySelectorAll("[data-filter-category]").forEach(button=>button.classList.toggle("active",button.dataset.filterCategory===this.filterCategory));this.filterBar.querySelectorAll("[data-filter-group]").forEach(group=>group.classList.toggle("hidden",group.dataset.filterGroup!==this.filterCategory));if(this.filterToggle){const off=this.filterDisabledCount();this.filterToggle.textContent=off?`FILTERS • ${off} OFF`:"FILTERS";}}
'''
          text=text[:start]+new+text[end:]

          old='fallbackHeight=Math.max(160,viewport-header-footer),height=Math.max(160,r.height||fallbackHeight),dpr=Math.min(2,Math.max(1,devicePixelRatio||1));if(r.height<2)this.shell.style.minHeight=`${height}px`;'
          new='fallbackHeight=Math.max(120,viewport-header-footer),height=r.height>=2?r.height:fallbackHeight,dpr=Math.min(2,Math.max(1,devicePixelRatio||1));'
          if old not in text: raise SystemExit('resize height marker missing')
          text=text.replace(old,new,1)
          view.write_text(text)

          css=Path('css/world.css')
          text=css.read_text()
          old='#mapViewHost{position:relative;z-index:20;display:flex;align-items:center;justify-content:flex-start;min-height:34px;padding:3px 4px;background:#05080a;border-bottom:1px solid var(--line);touch-action:manipulation}'
          new='#mapViewHost{position:relative;z-index:20;display:flex;align-items:center;justify-content:flex-start;gap:4px;min-height:30px;padding:2px 3px;background:#05080a;border-bottom:1px solid var(--line);touch-action:manipulation}'
          if old not in text: raise SystemExit('mapViewHost css marker missing')
          text=text.replace(old,new,1)
          old='#mapFilterHost{position:relative;z-index:12;background:#05080a;border-bottom:1px solid var(--line);touch-action:manipulation}'
          new='#mapFilterHost{position:relative;z-index:12;min-width:0;background:#05080a;border-bottom:1px solid var(--line);touch-action:manipulation}'
          text=text.replace(old,new,1)
          old='''.map-filters{display:grid;gap:2px;padding:3px 4px;background:#05080a;touch-action:manipulation;width:100%}
.map-filter-group{display:grid;grid-template-columns:42px minmax(0,1fr);gap:3px;align-items:start}.map-filter-label{font-size:6px;font-weight:900;letter-spacing:.08em;color:#667984;padding:7px 2px 0}.map-filter-options{display:flex;flex-wrap:wrap;gap:2px;min-width:0}
.map-filter,.map-filter-bulk{min-height:22px;padding:2px 5px;font-size:6.2px;font-weight:800;letter-spacing:.01em;background:#0b1116;border-color:#26333d;color:var(--muted)}
'''
          new='''.map-filter-toggle{margin-left:auto;min-height:25px;padding:3px 8px;font-size:7px;font-weight:900;letter-spacing:.04em;background:#0b1116;border-color:#26333d;color:var(--muted)}.map-filter-toggle.active{background:#17313d;border-color:var(--accent);color:#effaff}.map-filters{display:grid;grid-template-rows:auto auto;gap:2px;padding:2px 3px;background:#05080a;touch-action:manipulation;width:100%;min-width:0}.map-filter-tabs{display:flex;gap:2px;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none}.map-filter-tabs::-webkit-scrollbar,.map-filter-options::-webkit-scrollbar{display:none}.map-filter-category{flex:1 0 auto;min-height:21px;padding:2px 7px;font-size:6.2px;font-weight:900;background:#0b1116;border-color:#26333d;color:var(--muted)}.map-filter-category.active{background:#13222c;border-color:var(--accent);color:#e6f6ff}.map-filter-group{display:block;min-width:0}.map-filter-label{display:none}.map-filter-options{display:flex;flex-wrap:nowrap;gap:2px;min-width:0;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;padding-bottom:1px}
.map-filter,.map-filter-bulk{flex:0 0 auto;min-height:21px;padding:2px 5px;font-size:6.1px;font-weight:800;letter-spacing:.01em;background:#0b1116;border-color:#26333d;color:var(--muted)}
'''
          if old not in text: raise SystemExit('filter css block marker missing')
          text=text.replace(old,new,1)
          old='@media(max-width:370px){.map-filter-group{grid-template-columns:36px minmax(0,1fr);gap:2px}.map-filter-label{font-size:5.5px}.map-filter,.map-filter-bulk{font-size:5.6px;padding:2px 4px;min-height:21px}.map-filter-options{gap:1px}}'
          new='@media(max-width:370px){#mapViewHost{min-height:28px}.map-filter-toggle{padding:2px 6px;font-size:6.2px}.map-filter-category{padding:2px 6px;font-size:5.8px}.map-filter,.map-filter-bulk{font-size:5.6px;padding:2px 4px;min-height:20px}.map-filter-options{gap:1px}}'
          if old not in text: raise SystemExit('filter mobile css marker missing')
          css.write_text(text.replace(old,new,1))

          test=Path('tests/compact-resource-filters.test.js')
          test.write_text('''import assert from "node:assert/strict";\nimport fs from "node:fs";\nconst read=p=>fs.readFileSync(new URL(`../${p}`,import.meta.url),"utf8");\nconst view=read("js/ui/world-view.js"),css=read("css/world.css");\nassert.match(view,/this\\.filtersOpen=false;this\\.filterCategory="type"/);\nassert.match(view,/id="mapFilterToggle"|mapFilterToggle/);\nassert.match(view,/dataFilterCategory|filterCategory/);\nassert.match(view,/this\\.filterHost\\?\\.classList\\.toggle\\("hidden",!resource\\|\\|selecting\\|\\|!this\\.filtersOpen\\)/);\nassert.match(view,/height=r\\.height>=2\\?r\\.height:fallbackHeight/);\nassert.doesNotMatch(view,/height=Math\\.max\\(160,r\\.height/);\nassert.match(css,/\\.map-filter-options\\{[^}]*flex-wrap:nowrap[^}]*overflow-x:auto/);\nassert.match(css,/\\.map-filter-tabs\\{[^}]*overflow-x:auto/);\nassert.match(css,/\\.map-filter-toggle\\{/);\nconsole.log("compact resource filters / full map viewport regression test passed");\n''')

          package=Path('package.json')
          ptext=package.read_text()
          old='node tests/render-performance.test.js && node tests/map-view-toggle.test.js'
          new='node tests/render-performance.test.js && node tests/map-view-toggle.test.js && node tests/compact-resource-filters.test.js'
          if old not in ptext: raise SystemExit('package test marker missing')
          package.write_text(ptext.replace(old,new,1))

          allowed={'.js','.html','.json','.css','.md'}
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or '.github' in path.parts or path.suffix.lower() not in allowed: continue
              try: data=path.read_text(encoding='utf-8')
              except UnicodeDecodeError: continue
              updated=data.replace('5.5.4','5.5.5').replace(r'5\.5\.4',r'5\.5\.5')
              if updated!=data: path.write_text(updated,encoding='utf-8')
          PY
          npm test
      - name: Commit compact filter redesign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':(exclude).github/workflows/compact-resource-filters-builder.yml'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Redesign resource filters to preserve map viewport"
          git push origin HEAD:fix/compact-resource-filters
