name: Mobile Performance Builder V2

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'performance/mobile-rendering'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance/mobile-rendering
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply rendering performance fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          view=Path('js/ui/world-view.js');text=view.read_text()
          replacements=[
            ('this.icons.setOnReady?.(()=>this.safeDraw());','this.drawQueued=false;this.drawCount=0;this.assetReady=()=>this.safeDraw();this.icons.setOnReady?.(this.assetReady);'),
            ('dpr=Math.max(1,devicePixelRatio||1)','dpr=Math.min(2,Math.max(1,devicePixelRatio||1))'),
            ('safeDraw(){try{this.draw();}catch(e){this.diagnostics.error("world render failed",e);}}','safeDraw(){if(this.drawQueued)return;this.drawQueued=true;const schedule=typeof requestAnimationFrame==="function"?requestAnimationFrame:fn=>setTimeout(fn,0);schedule(()=>{this.drawQueued=false;try{this.drawCount++;this.draw();}catch(e){this.diagnostics.error("world render failed",e);}}); }'),
            ('img=artImage(src,()=>this.safeDraw());','img=artImage(src,this.assetReady);')
          ]
          for old,new in replacements:
              if old not in text: raise SystemExit(f'WorldView marker missing: {old[:45]}')
              text=text.replace(old,new,1)
          view.write_text(text)

          app=Path('js/app.js');text=app.read_text()
          old='this.accumulator=0;this.lastFrame=performance.now();this.pendingActiveDeadline=null;';new='this.accumulator=0;this.lastFrame=performance.now();this.lastHudFrame=0;this.pendingActiveDeadline=null;'
          if old not in text: raise SystemExit('App frame marker missing')
          text=text.replace(old,new,1)
          old='this.ui.render();this.tradeUI.render();}catch(e){this.diagnostics.error("animation loop failed",e);}requestAnimationFrame(next=>this.loop(next));}'
          new='if(now-this.lastHudFrame>=125){this.lastHudFrame=now;this.ui.render();this.tradeUI.render();}}catch(e){this.diagnostics.error("animation loop failed",e);}requestAnimationFrame(next=>this.loop(next));}'
          if old not in text: raise SystemExit('App loop marker missing')
          app.write_text(text.replace(old,new,1))

          Path('tests/render-performance.test.js').write_text('''import assert from "node:assert/strict";\nimport fs from "node:fs";\nconst view=fs.readFileSync(new URL("../js/ui/world-view.js",import.meta.url),"utf8");\nconst app=fs.readFileSync(new URL("../js/app.js",import.meta.url),"utf8");\nassert.match(view,/this\\.assetReady=\\(\\)=>this\\.safeDraw\\(\\)/);\nassert.doesNotMatch(view,/artImage\\(src,\\(\\)=>this\\.safeDraw\\(\\)\\)/);\nassert.match(view,/if\\(this\\.drawQueued\\)return/);\nassert.match(view,/Math\\.min\\(2,Math\\.max\\(1,devicePixelRatio\\|\\|1\\)\\)/);\nassert.match(app,/lastHudFrame=0/);\nassert.match(app,/now-this\\.lastHudFrame>=125/);\nconst root=new URL("../assets/art/",import.meta.url),files=[];\nfunction walk(dir){for(const e of fs.readdirSync(dir,{withFileTypes:true})){const p=new URL(e.name+(e.isDirectory()?"/":""),dir);if(e.isDirectory())walk(p);else if(e.name.endsWith(".webp"))files.push(p);}}\nwalk(root);const sizes=files.map(f=>fs.statSync(f).size),max=Math.max(...sizes),total=sizes.reduce((a,b)=>a+b,0);\nassert.ok(max<64*1024,`map WebP unexpectedly large: ${max} bytes`);\nconsole.log(`render performance guard passed (${files.length} WebPs, total ${total} bytes, max ${max} bytes)`);\n''')

          package=Path('package.json');text=package.read_text();old='node tests/global-expansion.test.js && node tests/land-view.test.js';new='node tests/global-expansion.test.js && node tests/land-view.test.js && node tests/render-performance.test.js'
          if old not in text: raise SystemExit('package test marker missing')
          package.write_text(text.replace(old,new,1))

          allowed={'.js','.html','.json','.css','.md'}
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or '.github' in path.parts or path.suffix.lower() not in allowed: continue
              try: data=path.read_text(encoding='utf-8')
              except UnicodeDecodeError: continue
              updated=data.replace('5.5.2','5.5.3').replace(r'5\.5\.2',r'5\.5\.3')
              if updated!=data: path.write_text(updated,encoding='utf-8')
          PY
          npm test
      - name: Commit performance changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mapfile -t files < <(git diff --name-only | grep -v '^\.github/workflows/' || true)
          [ ${#files[@]} -gt 0 ] || exit 0
          git add -- "${files[@]}"
          git commit -m "Improve mobile rendering performance"
          git push origin HEAD:performance/mobile-rendering
