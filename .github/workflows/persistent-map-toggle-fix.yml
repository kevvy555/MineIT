name: Persistent Map Toggle Fix Builder

on:
  push:
    branches:
      - fix/persistent-map-view-toggle

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/persistent-map-view-toggle
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply persistent map toggle fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index=Path('index.html');text=index.read_text()
          old='<main id="worldShell"><div id="mapFilterHost"></div><div id="worldViewport">'
          new='<main id="worldShell"><div id="mapViewHost" aria-label="Map view controls"></div><div id="mapFilterHost"></div><div id="worldViewport">'
          if old not in text: raise SystemExit('index world shell marker missing')
          index.write_text(text.replace(old,new,1))

          world_css=Path('css/world.css');text=world_css.read_text()
          old='#worldShell{display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden;min-height:160px;background:#000}\n#mapFilterHost{position:relative;z-index:12;background:#05080a;border-bottom:1px solid var(--line);touch-action:manipulation}'
          new='#worldShell{display:grid;grid-template-rows:auto auto minmax(0,1fr);overflow:hidden;min-height:160px;background:#000}\n#mapViewHost{position:relative;z-index:20;display:flex;align-items:center;justify-content:flex-start;min-height:34px;padding:3px 4px;background:#05080a;border-bottom:1px solid var(--line);touch-action:manipulation}\n#mapFilterHost{position:relative;z-index:12;background:#05080a;border-bottom:1px solid var(--line);touch-action:manipulation}'
          if old not in text: raise SystemExit('world css marker missing')
          world_css.write_text(text.replace(old,new,1))

          land_css=Path('css/land.css');text=land_css.read_text()
          old='.map-view-toggle{position:absolute;left:5px;bottom:5px;z-index:18;display:flex;gap:3px;padding:3px;background:rgba(5,8,10,.9);border:1px solid var(--line);border-radius:7px;touch-action:manipulation}'
          new='.map-view-toggle{position:relative;z-index:1;display:flex;gap:3px;padding:3px;background:rgba(5,8,10,.9);border:1px solid var(--line);border-radius:7px;touch-action:manipulation}'
          if old not in text: raise SystemExit('land css toggle marker missing')
          text=text.replace(old,new,1)
          text=text.replace('@media(max-width:370px){.landing-choice-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.map-view-toggle{left:3px;bottom:3px}.map-view-toggle button{padding:3px 6px}', '@media(max-width:370px){.landing-choice-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.map-view-toggle button{padding:3px 6px}',1)
          land_css.write_text(text)

          view=Path('js/ui/world-view.js');text=view.read_text()
          old='const old=this.shell.querySelector("#mapViewToggle");if(old)old.remove();\n    const wrap=document.createElement("div");wrap.id="mapViewToggle";wrap.className="map-view-toggle";'
          new='const host=document.querySelector("#mapViewHost")||this.shell,old=document.querySelector("#mapViewToggle");if(old)old.remove();\n    const wrap=document.createElement("div");wrap.id="mapViewToggle";wrap.className="map-view-toggle";'
          if old not in text: raise SystemExit('WorldView toggle creation marker missing')
          text=text.replace(old,new,1)
          old='this.shell.appendChild(wrap);this.viewToggle=wrap;this.syncView();'
          new='host.appendChild(wrap);this.viewToggle=wrap;this.syncView();'
          if old not in text: raise SystemExit('WorldView toggle append marker missing')
          view.write_text(text.replace(old,new,1))

          test=Path('tests/map-view-toggle.test.js')
          test.write_text('''import assert from "node:assert/strict";\nimport fs from "node:fs";\nconst read=p=>fs.readFileSync(new URL(`../${p}`,import.meta.url),"utf8");\nconst index=read("index.html"),view=read("js/ui/world-view.js"),world=read("css/world.css"),land=read("css/land.css");\nassert.match(index,/id="mapViewHost"[^>]*><\\/div><div id="mapFilterHost"/);\nassert.match(view,/document\\.querySelector\\("#mapViewHost"\\)\\|\\|this\\.shell/);\nassert.match(view,/host\\.appendChild\\(wrap\\)/);\nassert.doesNotMatch(view,/this\\.shell\\.appendChild\\(wrap\\)/);\nassert.match(world,/#worldShell\\{[^}]*grid-template-rows:auto auto minmax\\(0,1fr\\)/);\nassert.match(world,/#mapViewHost\\{[^}]*z-index:20/);\nconst toggleRule=land.match(/\\.map-view-toggle\\{([^}]*)\\}/)?.[1]||"";\nassert.doesNotMatch(toggleRule,/position:absolute/);\nassert.doesNotMatch(toggleRule,/bottom:/);\nconsole.log("persistent Land/Resources map toggle regression test passed");\n''')

          package=Path('package.json');text=package.read_text()
          old='node tests/land-view.test.js && node tests/render-performance.test.js'
          new='node tests/land-view.test.js && node tests/render-performance.test.js && node tests/map-view-toggle.test.js'
          if old not in text: raise SystemExit('package test marker missing')
          package.write_text(text.replace(old,new,1))

          allowed={'.js','.html','.json','.css','.md'}
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or '.github' in path.parts or path.suffix.lower() not in allowed: continue
              try: data=path.read_text(encoding='utf-8')
              except UnicodeDecodeError: continue
              updated=data.replace('5.5.3','5.5.4').replace(r'5\.5\.3',r'5\.5\.4')
              if updated!=data: path.write_text(updated,encoding='utf-8')
          PY
          npm test
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html css/world.css css/land.css js/ui/world-view.js tests/map-view-toggle.test.js package.json
          mapfile -t versioned < <(git diff --name-only | grep -v '^\.github/' || true)
          git add -- "${versioned[@]}"
          git commit -m "Keep Land and Resources controls always visible"
          git push origin HEAD:fix/persistent-map-view-toggle
