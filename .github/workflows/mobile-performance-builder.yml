name: Mobile Performance Builder

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'performance/mobile-rendering'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance/mobile-rendering
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply rendering performance fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          view = Path('js/ui/world-view.js')
          text = view.read_text()

          old = 'this.icons.setOnReady?.(()=>this.safeDraw());'
          new = 'this.drawQueued=false;this.drawCount=0;this.assetReady=()=>this.safeDraw();this.icons.setOnReady?.(this.assetReady);'
          if old not in text:
              raise SystemExit('WorldView icon callback marker not found')
          text = text.replace(old, new, 1)

          old = 'dpr=Math.max(1,devicePixelRatio||1)'
          new = 'dpr=Math.min(2,Math.max(1,devicePixelRatio||1))'
          if old not in text:
              raise SystemExit('WorldView DPR marker not found')
          text = text.replace(old, new, 1)

          old = 'safeDraw(){try{this.draw();}catch(e){this.diagnostics.error("world render failed",e);}}'
          new = 'safeDraw(){if(this.drawQueued)return;this.drawQueued=true;const schedule=typeof requestAnimationFrame==="function"?requestAnimationFrame:fn=>setTimeout(fn,0);schedule(()=>{this.drawQueued=false;try{this.drawCount++;this.draw();}catch(e){this.diagnostics.error("world render failed",e);}});}'
          if old not in text:
              raise SystemExit('WorldView safeDraw marker not found')
          text = text.replace(old, new, 1)

          old = 'img=artImage(src,()=>this.safeDraw());'
          new = 'img=artImage(src,this.assetReady);'
          if old not in text:
              raise SystemExit('WorldView terrain callback marker not found')
          text = text.replace(old, new, 1)
          view.write_text(text)

          app = Path('js/app.js')
          text = app.read_text()
          old = 'this.accumulator=0;this.lastFrame=performance.now();this.pendingActiveDeadline=null;'
          new = 'this.accumulator=0;this.lastFrame=performance.now();this.lastHudFrame=0;this.pendingActiveDeadline=null;'
          if old not in text:
              raise SystemExit('App frame state marker not found')
          text = text.replace(old, new, 1)

          old = 'this.ui.render();this.tradeUI.render();}catch(e){this.diagnostics.error("animation loop failed",e);}requestAnimationFrame(next=>this.loop(next));}'
          new = 'if(now-this.lastHudFrame>=125){this.lastHudFrame=now;this.ui.render();this.tradeUI.render();}}catch(e){this.diagnostics.error("animation loop failed",e);}requestAnimationFrame(next=>this.loop(next));}'
          if old not in text:
              raise SystemExit('App animation loop marker not found')
          text = text.replace(old, new, 1)
          app.write_text(text)

          test = Path('tests/render-performance.test.js')
          test.write_text('''import assert from "node:assert/strict";\nimport fs from "node:fs";\n\nconst view=fs.readFileSync(new URL("../js/ui/world-view.js",import.meta.url),"utf8");\nconst app=fs.readFileSync(new URL("../js/app.js",import.meta.url),"utf8");\n\nassert.match(view,/this\\.assetReady=\\(\\)=>this\\.safeDraw\\(\\)/,"terrain/resource image loads should share one stable redraw callback");\nassert.doesNotMatch(view,/artImage\\(src,\\(\\)=>this\\.safeDraw\\(\\)\\)/,"terrain drawing must not register a fresh callback per tile");\nassert.match(view,/if\\(this\\.drawQueued\\)return/,"map redraws should be coalesced");\nassert.match(view,/Math\\.min\\(2,Math\\.max\\(1,devicePixelRatio\\|\\|1\\)\\)/,"canvas DPR should be capped at 2");\nassert.match(app,/lastHudFrame=0/,"HUD rendering should be throttled");\nassert.match(app,/now-this\\.lastHudFrame>=125/,"HUD rendering should not run on every animation frame");\n\nconst assetRoot=new URL("../assets/art/",import.meta.url);\nconst files=[];\nfunction walk(dir){for(const entry of fs.readdirSync(dir,{withFileTypes:true})){const p=new URL(entry.name+(entry.isDirectory()?"/":""),dir);if(entry.isDirectory())walk(p);else if(entry.name.endsWith(".webp"))files.push(p);}}\nwalk(assetRoot);\nconst max=Math.max(...files.map(file=>fs.statSync(file).size));\nassert.ok(max<64*1024,`map WebP unexpectedly large: ${max} bytes`);\nconsole.log(`render performance guard passed (${files.length} WebPs, max ${max} bytes)`);\n''')

          package = Path('package.json')
          text = package.read_text()
          old = 'node tests/global-expansion.test.js && node tests/land-view.test.js'
          new = 'node tests/global-expansion.test.js && node tests/land-view.test.js && node tests/render-performance.test.js'
          if old not in text:
              raise SystemExit('package test script marker not found')
          package.write_text(text.replace(old,new,1))

          allowed = {'.js','.html','.json','.css','.md'}
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or '.github' in path.parts or path.suffix.lower() not in allowed:
                  continue
              try:
                  data = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated = data.replace('5.5.2','5.5.3').replace(r'5\\.5\\.2',r'5\\.5\\.3')
              if updated != data:
                  path.write_text(updated,encoding='utf-8')
          PY
          npm test
      - name: Commit performance changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mapfile -t files < <(git diff --name-only | grep -v '^\.github/workflows/' || true)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No application changes to commit"
            exit 0
          fi
          git add -- "${files[@]}"
          git commit -m "Improve mobile rendering performance"
          git push origin HEAD:performance/mobile-rendering
