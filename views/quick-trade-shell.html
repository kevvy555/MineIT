<div class="trade-quick-shell" data-trade-quick-shell>
  <div class="trade-quick-summary">
    <div class="trade-qmetric"><small>CASH</small><strong data-trade-summary="cash">{{CASH}}</strong></div>
    <div class="trade-qmetric"><small>IMPORT</small><strong data-trade-summary="import">{{IMPORT}}</strong></div>
    <div class="trade-qmetric"><small>EXPORT</small><strong data-trade-summary="export">{{EXPORT}}</strong></div>
    <div class="trade-qmetric"><small>PAX</small><strong data-trade-summary="pax">{{PAX}}</strong></div>
  </div>
  <div class="trade-quick-tabs">
    <button data-trade-tab="sell" class="{{SELL_ACTIVE}}" aria-pressed="{{SELL_PRESSED}}">SELL</button>
    <button data-trade-tab="buy" class="{{BUY_ACTIVE}}" aria-pressed="{{BUY_PRESSED}}">BUY</button>
    <button data-trade-tab="colonists" class="{{COLONISTS_ACTIVE}}" aria-pressed="{{COLONISTS_PRESSED}}" {{COLONISTS_DISABLED}}>COLONISTS</button>
  </div>
  <div class="trade-quick-view" data-trade-view-host></div>
  <div class="trade-quick-depart"><button data-depart class="warn">SHIP DEPARTS</button></div>
</div>
