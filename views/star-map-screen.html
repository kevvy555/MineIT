<div class="star-map-screen">
  {{SHIP_STATUS}}
  <div class="star-system-detail-host" id="starSystemDetail">
    {{CORPORATE_TRADE}}
    {{SYSTEM_DETAIL}}
  </div>
  <div class="exp-map-wrap">
    <canvas id="starMapCanvas" aria-label="Corporation star map"></canvas>
    <div class="exp-map-help">Drag to pan • pinch / wheel to zoom • tap a star to inspect</div>
  </div>
  <div class="exp-map-footer">
    <span>○ Corporate service radius {{SERVICE_RADIUS}} ly</span>
    <button data-ship-prep {{CARGO_DISABLED}}>CARGO BAY</button>
  </div>
</div>
