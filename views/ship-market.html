<div class="ship-market" data-ship-market>
  <section class="ship-market-header">
    <div><small>KDR CORPORATE NETWORK</small><strong>DEEP REACH FLEET PROCUREMENT</strong></div>
    <div class="ship-market-cash"><small>OPERATING CASH</small><strong data-market-cash></strong></div>
  </section>
  <div class="ship-market-status"><span>● NETWORK ONLINE</span><span>CHARTER ACCESS</span><span>FRAMEWORK RATE −35%</span><span data-market-source></span></div>

  <section class="ship-market-manufacturers" data-market-manufacturers></section>

  <section class="ship-market-selector">
    <div class="ship-market-selector-head"><div><small>APPROVED SHIPBUILDER</small><strong data-market-selected-manufacturer></strong></div><button data-market-role-picker>ALL ROLES ▾</button></div>
    <div class="ship-market-models" data-market-models></div>
  </section>

  <section class="ship-market-dossier">
    <div class="ship-market-dossier-head">
      <div><small data-market-manufacturer></small><h3 data-market-name></h3><p data-market-description></p></div>
      <button class="ship-market-compare-add" data-market-compare-toggle>+ COMPARE</button>
    </div>
    <div class="ship-market-tags" data-market-tags></div>
    <div class="ship-market-hero"><img data-market-hero alt="Selected vessel"><span data-market-art-status></span></div>
    <div class="ship-market-specs" data-market-specs></div>

    <div class="ship-market-procurement">
      <div><small>LIST</small><strong data-market-list></strong></div>
      <div class="rate"><small>RATE</small><strong data-market-rate></strong></div>
      <div class="price"><small>PRICE</small><strong data-market-price></strong></div>
      <div><small>LEAD</small><strong data-market-lead></strong></div>
      <div data-market-status-cell><small>STATUS</small><strong data-market-order-status></strong></div>
    </div>
    <div class="ship-market-traits" data-market-traits></div>

    <button class="ship-market-colony" data-market-colony-picker><small>DELIVER TO COLONY</small><strong data-market-colony></strong><span data-market-colony-detail></span></button>

    <div class="ship-market-actions"><button data-market-open-compare>COMPARE</button><button class="primary" data-market-review>REVIEW PURCHASE CONTRACT</button><button data-market-open-orders>ORDERS</button></div>
  </section>

  <div class="ship-market-popup hidden" data-market-popup>
    <div class="ship-market-popup-card"><div class="ship-market-popup-head"><strong data-market-popup-title></strong><button data-market-popup-close>×</button></div><div data-market-popup-options></div></div>
  </div>

  <template data-market-manufacturer-template><button class="ship-market-maker"><strong data-maker-name></strong><span data-maker-specialisation></span><small data-maker-count></small></button></template>
  <template data-market-model-template><button class="ship-market-model"><div class="ship-market-model-art"><img data-model-image alt=""></div><strong data-model-name></strong><span data-model-role></span><small data-model-price></small></button></template>
  <template data-market-tag-template><span></span></template>
  <template data-market-spec-template><div><small></small><strong></strong></div></template>
  <template data-market-popup-option-template><button class="ship-market-popup-option"><strong></strong><span></span></button></template>
</div>
