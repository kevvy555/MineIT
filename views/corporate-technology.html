<div class="tech-toolbar">
  <article class="card">
    <h3 data-tech-access-title></h3>
    <p data-tech-access-text></p>
    <div class="effect">Housing, Power, Food and Industry technology set the maximum level of each individual building. Mining technology is the deliberate exception: it unlocks extraction methods/resources, while each mine site's L1–L5 development controls local efficiency.</div>
  </article>
  <button data-tech-toggle></button>
</div>
<div class="tech-tree" data-tech-tree></div>
<template data-tech-path-template>
  <section class="tech-path" data-tech-path>
    <div class="tech-path-header"><strong data-tech-path-label></strong><span data-tech-path-level></span></div>
    <div class="tech-roadmap" data-tech-roadmap></div>
  </section>
</template>
<template data-tech-card-template>
  <article class="tech-roadmap-card" data-tech-card>
    <div class="tech-roadmap-level" data-tech-card-level></div>
    <div class="tech-roadmap-copy">
      <div class="tech-roadmap-title"><strong data-tech-card-name></strong><span data-tech-card-state></span></div>
      <p data-tech-card-description></p>
      <div class="effect" data-tech-card-effect></div>
      <div class="requirement" data-tech-card-requirement></div>
    </div>
    <div class="tech-roadmap-action" data-tech-card-action></div>
  </article>
</template>
