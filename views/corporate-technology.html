<div class="technology-screen" data-technology-screen>
  <header class="technology-topbar">
    <div class="technology-title">
      <small>CORPORATE CAPABILITY PACKAGES</small>
      <strong>COLONY TECHNOLOGY</strong>
    </div>
    <button class="technology-cash" type="button">
      <small>CORPORATION CASH</small>
      <strong data-tech-cash></strong>
    </button>
    <button class="technology-close" type="button" data-tech-close aria-label="Close technology screen">✕</button>
  </header>

  <section class="technology-support">
    <span class="technology-support-dot" aria-hidden="true"></span>
    <div>
      <strong data-tech-access-title></strong>
      <small data-tech-access-text></small>
    </div>
    <button type="button" data-tech-toggle></button>
  </section>

  <nav class="technology-categories" data-tech-categories aria-label="Technology categories"></nav>

  <main class="technology-workspace">
    <section class="technology-path-head">
      <div>
        <strong data-tech-path-label></strong>
        <small data-tech-path-level></small>
      </div>
      <div class="technology-legend" aria-label="Technology state legend">
        <b class="owned">OWNED</b>
        <b class="current">CURRENT</b>
        <b class="next">NEXT</b>
        <b class="pending">ORDERED</b>
      </div>
    </section>

    <section class="technology-levels" data-tech-levels aria-label="Technology levels"></section>

    <article class="technology-detail">
      <div class="technology-detail-title">
        <div class="technology-level-badge" data-tech-detail-level></div>
        <div>
          <h2 data-tech-detail-name></h2>
        </div>
        <div class="technology-detail-state" data-tech-detail-state></div>
      </div>

      <div class="technology-metrics" data-tech-metrics></div>

      <div class="technology-detail-body">
        <section class="technology-package">
          <div class="technology-section-title">
            <strong>WHAT THIS PACKAGE DELIVERS</strong>
            <span>PHYSICAL COLONY CAPABILITY</span>
          </div>
          <div class="technology-effect" data-tech-detail-description></div>
          <p class="technology-package-intro" data-tech-package-intro></p>
          <div class="technology-effect" data-tech-effect></div>
          <div class="technology-package-contents" data-tech-package-contents></div>
        </section>

        <section class="technology-costs">
          <div class="technology-section-title">
            <strong>FULL COST BREAKDOWN</strong>
            <span>PACKAGE + DELIVERY</span>
          </div>
          <div class="technology-cost-rows" data-tech-costs></div>
        </section>
      </div>

      <div class="technology-action-row">
        <div class="technology-requirement">
          <small>ORDER / DELIVERY</small>
          <strong data-tech-requirement></strong>
        </div>
        <button class="technology-order" type="button" data-tech-order></button>
      </div>
    </article>
  </main>

  <section class="technology-delivery-ledger">
    <div class="technology-ledger-head">
      <strong>ENGINEERING SHIP DELIVERIES</strong>
      <small data-tech-delivery-summary></small>
    </div>
    <div class="technology-deliveries" data-tech-deliveries></div>
    <div class="technology-deliveries-empty" data-tech-deliveries-empty>No Engineering Ship deliveries have been purchased for this colony yet.</div>
  </section>
</div>

<template data-tech-category-template>
  <button class="technology-category" type="button" data-tech-category>
    <span class="technology-category-icon" data-tech-category-icon></span>
    <strong data-tech-category-label></strong>
    <span data-tech-category-level></span>
  </button>
</template>

<template data-tech-level-template>
  <button class="technology-level" type="button" data-tech-level>
    <span data-tech-level-label></span>
    <i aria-hidden="true"></i>
  </button>
</template>

<template data-tech-metric-template>
  <div class="technology-metric">
    <small data-tech-metric-label></small>
    <strong data-tech-metric-value></strong>
  </div>
</template>

<template data-tech-package-item-template>
  <div class="technology-package-item">
    <span class="technology-package-check" aria-hidden="true">✓</span>
    <div>
      <strong data-tech-package-item-name></strong>
      <small data-tech-package-item-description></small>
    </div>
    <b data-tech-package-item-cost></b>
  </div>
</template>

<template data-tech-cost-row-template>
  <div class="technology-cost-row" data-tech-cost-row>
    <span data-tech-cost-label></span>
    <b data-tech-cost-value></b>
  </div>
</template>

<template data-tech-delivery-template>
  <article class="technology-delivery" data-tech-delivery>
    <div class="technology-delivery-id"><strong data-tech-delivery-id></strong><small>DELIVERY</small></div>
    <div class="technology-delivery-copy">
      <strong data-tech-delivery-upgrades></strong>
      <small data-tech-delivery-meta></small>
    </div>
    <div class="technology-delivery-status" data-tech-delivery-status></div>
    <div class="technology-delivery-total"><small>NET PAID</small><strong data-tech-delivery-total></strong></div>
    <button type="button" data-engineering-cancel>CANCEL</button>
  </article>
</template>
