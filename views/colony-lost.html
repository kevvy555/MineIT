<article class="card" data-colony-lost-view>
  <h3 class="bad">COLONY LOST</h3>
  <p>The population reached zero on <span data-colony-death-date></span>. The charter failed and all extraction and Industry have stopped permanently.</p>
  <div class="effect warn">This colony no longer consumes resources or operating cash. Corporation reputation was reduced when it was lost.</div>
</article>
<div class="grid2" style="margin-top:7px">
  <div class="metric"><small>Population</small><strong>0</strong></div>
  <div class="metric"><small>Final Industry level</small><strong data-colony-final-industry></strong></div>
  <div class="metric"><small>Stored Food</small><strong data-colony-food-stock></strong></div>
  <div class="metric"><small>Stored Fuel</small><strong data-colony-fuel-stock></strong></div>
</div>
<div class="colony-management">
  <button data-all-colonies>VIEW ALL COLONIES</button>
  <button data-abandon-dead class="bad">ABANDON DEAD COLONY</button>
</div>
