<section class="trade-view-panel" data-trade-sell-view>
  <div class="trade-view-head"><div><strong>SELL COLONY STOCK</strong><small>Highest quality is sold first. The colony-wide reserve is protected for every resource.</small></div><b data-sell-total></b></div>
  <div data-trade-amount-host></div>
  <div class="trade-category-sell">
    <button data-sell-category="food"></button>
    <button data-sell-category="build"></button>
    <button data-sell-category="fuel"></button>
    <button data-sell-category="ore"></button>
  </div>
  <div class="trade-quick-list" data-sell-rows></div>
  <div class="trade-empty" data-sell-empty>No stock is available above the colony reserve.</div>
  <div class="trade-view-footer">
    <button data-sell-all class="trade-primary"></button>
    <div class="trade-pager" data-trade-pager>
      <button data-page="sell" data-dir="-1">‹</button><span data-page-label></span><button data-page="sell" data-dir="1">›</button>
    </div>
  </div>
  <template data-sell-row-template>
    <div class="trade-quick-row">
      <div class="trade-row-copy"><strong data-sell-name></strong><small><span data-sell-stock></span><span class="reserve" data-sell-reserve></span><span data-sell-available></span></small></div>
      <button data-sell-key><span data-sell-label></span><span data-sell-revenue></span></button>
    </div>
  </template>
</section>
