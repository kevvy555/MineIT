<section class="trade-view-panel buy-view" data-trade-buy-view>
  <div class="trade-view-head"><div><strong>BUY FROM CORPORATION</strong><small>Choose an amount once, then tap resources to buy.</small></div><b data-buy-cargo></b></div>
  <div data-trade-amount-host></div>
  <div class="trade-buy-categories" data-buy-categories></div>
  <div class="trade-quick-list buy-list" data-buy-rows></div>
  <div class="trade-view-footer">
    <button data-buy-reserve class="trade-secondary"></button>
    <div class="trade-pager" data-trade-pager>
      <button data-page="buy" data-dir="-1">‹</button><span data-page-label></span><button data-page="buy" data-dir="1">›</button>
    </div>
  </div>
</section>
<template data-buy-category-template><button data-buy-category></button></template>
<template data-buy-row-template>
  <div class="trade-quick-row">
    <div class="trade-row-copy"><strong data-buy-name></strong><small><span data-buy-stock></span><span class="reserve" data-buy-reserve-copy></span><span data-buy-price></span></small></div>
    <button data-buy-key><span data-buy-label></span><span data-buy-cost></span></button>
  </div>
</template>
