<section class="buyer-collection-screen" data-buyer-collection-screen>
  <header class="buyer-collection-head"><div><small>BUYER COLLECTION EVENT • CORPORATION TIME PAUSED</small><strong data-collection-title></strong></div><button data-collection-dismiss aria-label="Collection decision required">✕</button></header>
  <main class="buyer-collection-card">
    <section class="buyer-ship-hero"><img data-collection-ship-image alt="Buyer collection ship"><div class="buyer-art-fallback" data-collection-ship-fallback></div><div class="buyer-ship-caption"><strong data-collection-ship-name></strong><small data-collection-ship-description></small></div></section>
    <section class="buyer-collection-identity"><div class="buyer-mini-portrait"><img data-collection-portrait alt="Buyer portrait"><div class="buyer-art-fallback" data-collection-portrait-fallback></div></div><div><h2 data-collection-buyer></h2><p data-collection-role></p><strong data-collection-company></strong><p data-collection-business></p></div><div class="buyer-ship-badge"><strong data-collection-capacity></strong><small>BUYER VESSEL</small></div></section>
    <div class="buyer-collection-alert" data-collection-alert></div>
    <section class="buyer-collection-grid">
      <div class="buyer-collection-metric"><small>RESOURCE</small><strong data-collection-resource></strong></div><div class="buyer-collection-metric"><small>MIN QUALITY</small><strong data-collection-quality></strong></div><div class="buyer-collection-metric"><small>CONTRACT LOAD</small><strong data-collection-load></strong></div><div class="buyer-collection-metric"><small>QUALIFYING STOCK</small><strong data-collection-stock></strong></div><div class="buyer-collection-metric"><small>PRICE / UNIT</small><strong data-collection-price></strong></div><div class="buyer-collection-metric"><small>DAYS LATE</small><strong data-collection-late></strong></div>
    </section>
    <section class="buyer-fulfilment"><div class="buyer-fulfilment-head"><span>FULFILMENT AVAILABLE</span><span data-collection-percent></span></div><div class="buyer-fulfilment-bar"><i data-collection-bar></i></div><div class="buyer-fulfilment-bands"><div class="buyer-fulfilment-band" data-collection-band="full">100% • FULL</div><div class="buyer-fulfilment-band" data-collection-band="minor">75–99% • -1</div><div class="buyer-fulfilment-band" data-collection-band="major">50–74% • -2</div></div></section>
    <section class="buyer-impact"><div><h3>IF TRANSFERRED NOW</h3><p data-collection-impact></p><p data-collection-payment></p><p data-collection-global></p></div><div class="buyer-impact-score" data-collection-score></div></section>
    <div class="buyer-collection-note" data-collection-note></div>
  </main>
  <footer class="buyer-collection-actions"><button class="buyer-wait" data-collection-wait></button><button class="buyer-transfer" data-collection-transfer></button></footer>
</section>
