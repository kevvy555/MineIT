<article class="card" data-collection-empty hidden>
  <h3>No active collection sites</h3>
  <p data-collection-empty-copy></p>
</article>
<div class="collection-table" data-collection-table>
  <div class="collection-row collection-head" data-collection-head></div>
  <div data-collection-rows></div>
</div>
<template data-collection-header-template>
  <button class="collection-sort" data-collection-sort><span data-collection-label></span><b data-collection-arrow></b></button>
</template>
<template data-collection-row-template>
  <div class="collection-row" data-collection-row>
    <strong data-collection-name></strong>
    <span data-collection-category></span>
    <span data-collection-rate></span>
    <span data-collection-stock></span>
    <span data-collection-remaining></span>
  </div>
</template>
