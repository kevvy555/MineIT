<div class="resource-detail-shell" data-undeveloped-resource-view>
  <section class="resource-detail-hero">
    <div class="resource-detail-art" role="img" data-resource-art></div>
    <div class="resource-detail-copy">
      <div class="resource-detail-kicker">SURVEYED RESOURCE</div>
      <strong class="resource-detail-title" data-resource-title></strong>
      <div class="resource-detail-badges">
        <span class="resource-badge accent">UNDEVELOPED</span>
        <span class="resource-badge" data-resource-category></span>
        <span class="resource-badge" data-resource-rarity></span>
      </div>
    </div>
  </section>

  <section class="resource-detail-facts">
    <div class="resource-fact"><small>QUALITY</small><strong class="accent" data-resource-quality></strong></div>
    <div class="resource-fact"><small data-resource-size-label></small><strong data-resource-size></strong></div>
    <div class="resource-fact"><small data-resource-remaining-label></small><strong data-resource-remaining></strong></div>
    <div class="resource-fact"><small>IN STOCK</small><strong data-resource-stock></strong></div>
  </section>

  <section class="resource-detail-section">
    <div class="resource-section-title"><span>DEVELOPMENT REQUIREMENTS</span><i></i></div>
    <div class="resource-requirements" data-resource-requirements></div>
    <template data-resource-requirement-template>
      <div class="resource-requirement">
        <small data-resource-requirement-label></small>
        <strong data-resource-requirement-value></strong>
        <span data-resource-requirement-current></span>
      </div>
    </template>
    <div class="resource-ready-state" data-resource-ready-state></div>
  </section>

  <section class="resource-detail-section">
    <div class="resource-section-title"><span>WHEN DEVELOPED</span><i></i></div>
    <div class="resource-developed-result">
      <div><small>BUILDING</small><strong data-resource-building></strong></div>
      <div><small>OUTPUT</small><strong data-resource-output></strong></div>
    </div>
  </section>

  <div class="resource-detail-actions">
    <button class="action resource-develop" data-resource-develop>DEVELOP SITE</button>
    <button class="resource-close" data-resource-close>CLOSE</button>
  </div>
</div>
