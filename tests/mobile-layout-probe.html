<!doctype html><meta charset="utf-8"><style>html,body,#frame{margin:0;width:100%;height:100%;border:0;overflow:hidden}#result{position:fixed;z-index:9999;top:0;left:0;background:white;color:black;font:12px monospace}</style><div id="result">WAIT</div><iframe id="frame" src="../index.html"></iframe><script>
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function run(){
  const out=document.querySelector('#result'),frame=document.querySelector('#frame');
  await new Promise(r=>frame.addEventListener('load',r,{once:true}));await sleep(2500);
  const d=frame.contentDocument,w=frame.contentWindow,fail=[];
  const viewport=d.querySelector('#worldViewport'),canvas=d.querySelector('#world'),overlay=d.querySelector('#overlayRoot'),context=d.querySelector('#contextBar');
  if(!viewport||!canvas)fail.push('missing map');if(!overlay)fail.push('missing overlay root');if(!context)fail.push('missing context bar');if(!d.querySelector('#attentionStrip'))fail.push('missing attention strip');
  if(d.querySelector('#modal')?.parentElement!==overlay)fail.push('modal is not owned by overlay root');if(d.querySelector('#tilePanel')?.parentElement!==overlay)fail.push('tile panel is not owned by overlay root');
  const checkMap=label=>{const v=d.querySelector('#worldViewport'),c=d.querySelector('#world');if(!v||!c){fail.push(label+':missing map');return 0;}const vr=v.getBoundingClientRect(),cr=c.getBoundingClientRect();if(vr.height<60)fail.push(label+':viewport '+vr.height);if(Math.abs(vr.top-cr.top)>1||Math.abs(vr.bottom-cr.bottom)>1||Math.abs(vr.left-cr.left)>1||Math.abs(vr.right-cr.right)>1)fail.push(label+':canvas escapes viewport');return vr.height;};
  const choice=d.querySelector('[data-land-choice]');if(choice){choice.click();await sleep(700);}
  const h0=checkMap('unified');
  if(d.querySelector('[data-map-view="land"]')||d.querySelector('[data-map-view="resource"]'))fail.push('legacy two-map controls remain');
  const unified=d.querySelector('[data-map-view="unified"]');if(!unified)fail.push('unified colony map control missing');
  const filter=d.querySelector('#mapFilterToggle');if(!filter)fail.push('filter button missing');else{filter.click();await sleep(100);const h1=checkMap('filters');if(Math.abs(h1-h0)>2)fail.push('filters change map height '+h0+'->'+h1);const fuel=d.querySelector('[data-map-focus="fuel"]');if(!fuel)fail.push('fuel quick filter missing');else{fuel.click();await sleep(60);checkMap('fuel focus');}let back=d.querySelector('[data-filter-back]');if(back){back.click();await sleep(60);}}
  const problems=d.querySelector('#mapProblemsToggle');if(!problems)fail.push('problems shortcut missing');else{problems.click();await sleep(60);checkMap('problems');}
  d.dispatchEvent(new w.CustomEvent('mineit:tile-selected',{detail:{x:0,y:0}}));await sleep(80);if(!/LANDED SHIP/.test(d.querySelector('#contextTitle')?.textContent||''))fail.push('tile selection did not update context bar');if(!d.querySelector('#contextActions button'))fail.push('context actions missing after selection');
  for(const id of['housingHud','powerHud','industryHud','workforceHud','foodStock','buildStock','fuelStock','oreStock'])if(!d.getElementById(id))fail.push('missing HUD '+id);
  for(const b of d.querySelectorAll('.app-footer button')){const r=b.getBoundingClientRect();if(r.width<1||r.height<1)continue;const hit=d.elementFromPoint(r.left+r.width/2,r.top+r.height/2);if(!(hit===b||b.contains(hit)))fail.push('footer blocked:'+b.id+':'+(hit?.id||hit?.className||hit?.tagName));}
  for(const speed of d.querySelectorAll('[data-speed]'))if(speed.onclick!==null)fail.push('legacy speed onclick remains:'+speed.dataset.speed);
  const modal=d.getElementById('modal'),tilePanel=d.getElementById('tilePanel');
  for(const id of['coloniesBtn','techBtn','menuBtn','tradeBtn']){
    const b=d.getElementById(id);if(!b||b.disabled)continue;
    modal?.classList.add('hidden');tilePanel?.classList.add('hidden');
    const errorsBefore=w.mineITBoot?.diagnostics?.errors||0;b.click();await sleep(100);
    if(!modal||modal.classList.contains('hidden')){const errorsAfter=w.mineITBoot?.diagnostics?.errors||0;fail.push(id+':did not open modal'+(errorsAfter>errorsBefore?':runtime error':''));}
    modal?.querySelector('[data-close]')?.click();modal?.classList.add('hidden');await sleep(30);
  }
  out.textContent=fail.length?'FAIL '+fail.join(' | '):'PASS presentation layout, unified map, contextual actions and footer controls';
}
run().catch(e=>document.querySelector('#result').textContent='FAIL '+e.stack);
</script>
