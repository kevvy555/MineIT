<!doctype html><meta charset="utf-8"><style>html,body,#frame{margin:0;width:100%;height:100%;border:0;overflow:hidden}#result{position:fixed;z-index:9999;top:0;left:0;background:white;color:black;font:12px monospace}</style><div id="result">WAIT</div><iframe id="frame" src="../index.html"></iframe><script>
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function run(){
  const out=document.querySelector('#result'),frame=document.querySelector('#frame');
  await new Promise(r=>frame.addEventListener('load',r,{once:true}));
  await sleep(2500);
  const d=frame.contentDocument,fail=[];

  const viewport=d.querySelector('#worldViewport'),canvas=d.querySelector('#world'),overlay=d.querySelector('#overlayRoot');
  if(!viewport||!canvas)fail.push('missing map');
  if(!overlay)fail.push('missing overlay root');
  if(d.querySelector('#modal')?.parentElement!==overlay)fail.push('modal is not owned by overlay root');
  if(d.querySelector('#tilePanel')?.parentElement!==overlay)fail.push('tile panel is not owned by overlay root');

  const checkMap=label=>{
    const v=d.querySelector('#worldViewport'),c=d.querySelector('#world');
    if(!v||!c){fail.push(label+':missing map');return 0;}
    const vr=v.getBoundingClientRect(),cr=c.getBoundingClientRect();
    if(vr.height<60)fail.push(label+':viewport '+vr.height);
    if(Math.abs(vr.top-cr.top)>1||Math.abs(vr.bottom-cr.bottom)>1||Math.abs(vr.left-cr.left)>1||Math.abs(vr.right-cr.right)>1)fail.push(label+':canvas escapes viewport');
    return vr.height;
  };

  const choice=d.querySelector('[data-land-choice]');
  if(choice){choice.click();await sleep(700);}

  const land=d.querySelector('[data-map-view="land"]'),res=d.querySelector('[data-map-view="resource"]');
  if(!land||!res)fail.push('map view buttons missing');
  const h0=checkMap('land');
  if(res){
    res.click();await sleep(120);
    const h1=checkMap('resource');
    if(Math.abs(h1-h0)>2)fail.push('resource changes map height '+h0+'->'+h1);
    const filter=d.querySelector('#mapFilterToggle');
    if(!filter)fail.push('filter button missing');
    else{
      filter.click();await sleep(100);
      const h2=checkMap('filters');
      if(Math.abs(h2-h1)>2)fail.push('filters change map height '+h1+'->'+h2);
      const type=d.querySelector('[data-filter-category="type"]');
      if(type){type.click();await sleep(80);const h3=checkMap('type filters');if(Math.abs(h3-h1)>2)fail.push('type filters change map height');}
      let back=d.querySelector('[data-filter-back]');
      if(back){back.click();await sleep(40);back=d.querySelector('[data-filter-back]');back?.click();await sleep(60);}
    }
  }
  if(land){land.click();await sleep(80);checkMap('land-return');}

  for(const b of d.querySelectorAll('.app-footer button')){
    const r=b.getBoundingClientRect();
    if(r.width<1||r.height<1)continue;
    const hit=d.elementFromPoint(r.left+r.width/2,r.top+r.height/2);
    if(!(hit===b||b.contains(hit)))fail.push('footer blocked:'+b.id+':'+(hit?.id||hit?.className||hit?.tagName));
  }

  for(const speed of d.querySelectorAll('[data-speed]'))if(speed.onclick!==null)fail.push('legacy speed onclick remains:'+speed.dataset.speed);

  for(const id of['collectionBtn','tradeBtn','colonyBtn','coloniesBtn','techBtn','goalsBtn','menuBtn']){
    const b=d.getElementById(id);
    if(!b||b.disabled)continue;
    b.click();await sleep(60);
    const modal=d.getElementById('modal');
    if(!modal||modal.classList.contains('hidden'))fail.push(id+':did not open modal');
    modal?.querySelector('[data-close]')?.click();
    await sleep(25);
  }

  out.textContent=fail.length?'FAIL '+fail.join(' | '):'PASS presentation layout, map transitions and footer actions';
}
run().catch(e=>document.querySelector('#result').textContent='FAIL '+e.stack);
</script>
