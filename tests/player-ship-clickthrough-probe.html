<!doctype html>
<meta charset="utf-8">
<title>MineIT player ship click-through probe</title>
<body><pre id="result">RUNNING</pre><script type="module">
const result=document.querySelector('#result');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const html=await fetch('../index.html',{cache:'no-store'}).then(r=>r.text());
const instrumentation=`<base href="../"><script>window.__probeErrors=[];window.addEventListener('error',e=>window.__probeErrors.push(String(e.error||e.message)));window.addEventListener('unhandledrejection',e=>window.__probeErrors.push(String(e.reason)));<\/script>`;
const iframe=document.createElement('iframe');iframe.style.width='390px';iframe.style.height='844px';iframe.srcdoc=html.replace('<head>','<head>'+instrumentation);document.body.appendChild(iframe);
await new Promise(resolve=>iframe.addEventListener('load',resolve,{once:true}));
await sleep(2500);
const w=iframe.contentWindow,d=w.document;
const pointer=(canvas,type,x,y,id=912)=>canvas.dispatchEvent(new w.PointerEvent(type,{bubbles:true,cancelable:true,clientX:x,clientY:y,pointerId:id,pointerType:'touch',button:0,buttons:type==='pointerdown'?1:0}));
const clickCanvas=(canvas,x,y)=>canvas.dispatchEvent(new w.MouseEvent('click',{bubbles:true,cancelable:true,clientX:x,clientY:y,detail:1}));
try{
  const landing=d.querySelector('.landing-choice-grid button');if(landing){landing.click();await sleep(300);}
  const canvas=d.querySelector('#world');if(!canvas)throw new Error('Missing world canvas');
  const r=canvas.getBoundingClientRect(),x=r.left+r.width/16,y=r.top+r.height/16;

  // Gesture events alone must not activate the ship. Activation belongs to click.
  pointer(canvas,'pointerdown',x,y);pointer(canvas,'pointerup',x,y);
  await sleep(20);
  if(d.querySelector('[data-player-ship-action]'))throw new Error('pointerup activated Player Colony Ship before click');

  // The browser click for that tap opens the panel and cannot retarget to a newly-rendered button.
  clickCanvas(canvas,x,y);await sleep(30);
  const star=d.querySelector('[data-player-ship-action="star-map"]');if(!star)throw new Error('Canvas click did not open Player Colony Ship');
  const title=d.querySelector('#modal .panel-title strong')?.textContent?.trim();if(title!=='Player Colony Ship')throw new Error('Canvas click opened '+(title||'an unknown panel')+' instead of Player Colony Ship');
  if(d.querySelector('#starMapCanvas'))throw new Error('Opening canvas click also activated Star Map');

  // A separate deliberate DOM click remains a normal activation.
  star.click();await sleep(100);
  if(!d.querySelector('#starMapCanvas'))throw new Error('A deliberate STAR MAP click did not open Star Map');
  d.querySelector('#modal [data-close]')?.click();await sleep(20);

  // A consumed pointer gesture must suppress its compatibility click.
  pointer(canvas,'pointerdown',x,y,913);
  pointer(canvas,'pointermove',x+18,y,913);
  pointer(canvas,'pointerup',x+18,y,913);
  clickCanvas(canvas,x+18,y);await sleep(30);
  if(d.querySelector('[data-player-ship-action]'))throw new Error('Consumed drag gesture activated Player Colony Ship through its follow-on click');

  // The next clean tap/click must still activate normally.
  pointer(canvas,'pointerdown',x,y,914);pointer(canvas,'pointerup',x,y,914);clickCanvas(canvas,x,y);await sleep(30);
  if(!d.querySelector('[data-player-ship-action="star-map"]'))throw new Error('Clean tap after drag suppression did not activate Player Colony Ship');

  if(w.__probeErrors.length)throw new Error('Runtime errors: '+w.__probeErrors.join(' | '));
  result.textContent='PASS player ship opening gesture cannot click through to Star Map';
}catch(error){result.textContent='FAIL player ship click-through probe • '+(error?.stack||error);}
</script></body>
