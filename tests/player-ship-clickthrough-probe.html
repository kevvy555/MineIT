<!doctype html>
<meta charset="utf-8">
<title>MineIT player ship click-through probe</title>
<body><pre id="result">RUNNING</pre><script type="module">
const result=document.querySelector('#result');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const html=await fetch('../index.html',{cache:'no-store'}).then(r=>r.text());
const instrumentation=`<base href="../"><script>window.__probeErrors=[];window.addEventListener('error',e=>window.__probeErrors.push(String(e.error||e.message)));window.addEventListener('unhandledrejection',e=>window.__probeErrors.push(String(e.reason)));<\/script>`;
const iframe=document.createElement('iframe');iframe.style.width='390px';iframe.style.height='844px';iframe.srcdoc=html.replace('<head>','<head>'+instrumentation);document.body.appendChild(iframe);
await new Promise(resolve=>iframe.addEventListener('load',resolve,{once:true}));
await sleep(2500);
const w=iframe.contentWindow,d=w.document;
const pointer=(target,type,x,y,id=912)=>target.dispatchEvent(new w.PointerEvent(type,{bubbles:true,cancelable:true,clientX:x,clientY:y,pointerId:id,pointerType:'touch',button:0,buttons:type==='pointerdown'?1:0}));
const clickAt=(target,x,y)=>target.dispatchEvent(new w.MouseEvent('click',{bubbles:true,cancelable:true,clientX:x,clientY:y,detail:1}));
const center=element=>{const r=element.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2};};
try{
  const landing=d.querySelector('.landing-choice-grid button');if(landing){landing.click();await sleep(300);}
  const canvas=d.querySelector('#world');if(!canvas)throw new Error('Missing world canvas');
  const r=canvas.getBoundingClientRect(),x=r.left+r.width/16,y=r.top+r.height/16;

  // Gesture events alone must not activate the ship. Activation belongs to click.
  pointer(canvas,'pointerdown',x,y);pointer(canvas,'pointerup',x,y);
  await sleep(20);
  if(d.querySelector('[data-player-ship-action]'))throw new Error('pointerup activated Player Colony Ship before click');

  // The browser click for that tap opens the panel and cannot retarget to a newly-rendered button.
  clickAt(canvas,x,y);await sleep(30);
  let star=d.querySelector('[data-player-ship-action="star-map"]');if(!star)throw new Error('Canvas click did not open Player Colony Ship');
  const title=d.querySelector('#modal .panel-title strong')?.textContent?.trim();if(title!=='Player Colony Ship')throw new Error('Canvas click opened '+(title||'an unknown panel')+' instead of Player Colony Ship');
  if(d.querySelector('#starMapCanvas'))throw new Error('Opening canvas click also activated Star Map');

  // A realistic 180ms touch held across at least one 125ms HUD render must still activate once.
  let p=center(star);pointer(star,'pointerdown',p.x,p.y,915);await sleep(180);pointer(star,'pointerup',p.x,p.y,915);clickAt(star,p.x,p.y);await sleep(180);
  if(!d.querySelector('#starMapCanvas'))throw new Error('Held STAR MAP touch did not open Star Map');
  d.querySelector('#modal [data-close]')?.click();await sleep(20);

  // A consumed pointer gesture must suppress its compatibility click on the canvas.
  pointer(canvas,'pointerdown',x,y,913);
  pointer(canvas,'pointermove',x+18,y,913);
  pointer(canvas,'pointerup',x+18,y,913);
  clickAt(canvas,x+18,y);await sleep(30);
  if(d.querySelector('[data-player-ship-action]'))throw new Error('Consumed drag gesture activated Player Colony Ship through its follow-on click');

  // The next clean tap/click must still activate normally.
  pointer(canvas,'pointerdown',x,y,914);pointer(canvas,'pointerup',x,y,914);clickAt(canvas,x,y);await sleep(30);
  star=d.querySelector('[data-player-ship-action="star-map"]');if(!star)throw new Error('Clean tap after drag suppression did not activate Player Colony Ship');

  // The diagnostic tracer must detect the exact pressed node being removed while a pointer is held.
  p=center(star);pointer(star,'pointerdown',p.x,p.y,916);star.replaceWith(star.cloneNode(true));await sleep(30);const replacement=d.querySelector('[data-player-ship-action="star-map"]');pointer(replacement,'pointerup',p.x,p.y,916);await sleep(20);
  d.querySelector('#modal [data-close]')?.click();await sleep(20);d.querySelector('#menuBtn')?.click();await sleep(20);d.querySelector('[data-diagnostics]')?.click();await sleep(30);
  const trace=d.querySelector('.diag-log')?.textContent||'';
  for(const marker of['"stage":"pointerdown"','"stage":"pointerup"','"stage":"click-capture"','"stage":"click-bubble"','"stage":"target-disconnected"'])if(!trace.includes(marker))throw new Error('Interaction trace missing '+marker);
  if(!trace.includes('playerShipAction=star-map'))throw new Error('Interaction trace did not identify the Player Ship STAR MAP action');

  if(w.__probeErrors.length)throw new Error('Runtime errors: '+w.__probeErrors.join(' | '));
  result.textContent='PASS player ship opening gesture cannot click through to Star Map';
}catch(error){result.textContent='FAIL player ship click-through probe • '+(error?.stack||error);}
</script></body>
