<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#050708">
  <title>MineIT</title>
  <link rel="stylesheet" href="./css/app.css?v=5.6.0">
  <link rel="stylesheet" href="./css/world.css?v=5.6.0">
  <link rel="stylesheet" href="./css/panels.css?v=5.5.5">
  <link rel="stylesheet" href="./css/portfolio.css?v=5.5.5">
  <link rel="stylesheet" href="./css/trade-quality.css?v=5.5.5">
  <link rel="stylesheet" href="./css/ui-enhancements.css?v=5.5.5">
  <link rel="stylesheet" href="./css/land.css?v=5.6.0">
  <script type="importmap">
  {
    "imports": {
      "./js/domain/resource-service.js?v=5.5.5": "./js/domain/resource-service-v562.js?v=5.6.2",
      "./js/domain/collection-service.js?v=5.5.5": "./js/domain/collection-service.js?v=5.6.2",
      "./js/domain/colony-service.js?v=5.5.5": "./js/domain/colony-service-v562.js?v=5.6.2",
      "./js/domain/site-service.js?v=5.5.5": "./js/domain/site-service-v562.js?v=5.6.2",
      "./js/domain/simulation-engine.js?v=5.5.5": "./js/domain/simulation-engine-v562.js?v=5.6.2",
      "./js/ui/world-view.js?v=5.5.5": "./js/ui/world-view-v56.js?v=5.6.2",
      "./js/ui/ui-controller.js?v=5.5.5": "./js/ui/ui-controller-v56.js?v=5.6.2",
      "./js/ui/v55-trade-ui.js?v=5.5.5": "./js/ui/v55-trade-ui-v56.js?v=5.6.0"
    }
  }
  </script>
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="top-row"><strong class="brand">MINEIT</strong><span id="contractName" class="contract-name"></span></div>
      <div class="time-row"><div class="progress"><i id="timeBar"></i></div><span id="dateText" class="date"></span></div>
      <div class="goal-grid">
        <article class="goal-card"><small><span>FOOD PROD</span><span id="foodGoal"></span></small><strong id="foodVal" class="food">0</strong><div class="mini"><i id="foodBar" class="food-bg"></i></div></article>
        <article class="goal-card"><small><span>INDUSTRY</span><span id="indGoal"></span></small><strong id="indVal" class="ore">0</strong><div class="mini"><i id="indBar" class="ore-bg"></i></div></article>
        <article class="goal-card"><small><span>POPULATION</span><span id="popGoal"></span></small><strong id="popVal">0</strong><div class="mini"><i id="popBar" class="population-bg"></i></div></article>
      </div>
    </header>

    <main id="worldShell">
      <div id="mapViewHost" aria-label="Map view controls"></div>
      <div id="worldViewport">
        <canvas id="world"></canvas>
        <div id="cornerHud" class="hud-chip"><strong id="cameraText">LAND VIEW • 8×8</strong><span>Tap to act • drag unsurveyed tiles to multi-survey • hold 2s for details</span></div>
        <div id="scanHud" class="hud-chip scan-hud hidden"><strong>SCANNING</strong><span id="scanText"></span><div class="scan-progress"><i id="scanBar"></i></div></div>
      </div>
      <div id="overlayRoot" aria-label="Application overlays">
        <div id="toast" class="toast hidden"></div>
        <button id="errorBadge" class="error-badge hidden">ERROR LOG</button>
        <section id="tilePanel" class="panel tile-panel hidden"></section>
        <section id="modal" class="panel modal hidden"></section>
      </div>
    </main>

    <footer class="app-footer">
      <div class="stats-grid">
        <button id="companyBtn" class="stat"><strong id="cash">£0</strong><span>CASH</span></button>
        <div class="stat"><strong id="income">£0</strong><span>STOCK VALUE</span></div>
        <div class="stat"><strong id="foodStock">0</strong><span>FOOD</span></div>
        <div class="stat"><strong id="buildStock">0</strong><span>BUILD</span></div>
        <div class="stat"><strong id="fuelStock">0</strong><span>FUEL</span></div>
        <div class="stat"><strong id="oreStock">0</strong><span>ORE</span></div>
      </div>
      <div class="controls">
        <button data-speed="0">⏸</button><button data-speed="1" class="active">▶</button><button data-speed="2">▶▶</button><button data-speed="4">▶▶▶</button>
        <button id="collectionBtn">COLLECT</button><button id="tradeBtn">SHIP</button><button id="colonyBtn">COLONY</button><button id="coloniesBtn">COLONIES</button><button id="techBtn">TECH</button><button id="goalsBtn">GOALS</button><button id="menuBtn">☰</button>
      </div>
    </footer>
  </div>
  <script type="module" src="./js/app.js?v=5.5.5"></script>
</body>
</html>
